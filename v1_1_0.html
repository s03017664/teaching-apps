<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="親子棋館 v1.1.1" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#141e17" />
  <title>親子棋館 v1.1.0 — 六合一親子棋藝合集</title>
  <style>
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      font-family: 'PingFang HK', 'PingFang TC', -apple-system, BlinkMacSystemFont, 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
      background: radial-gradient(circle at 50% 20%, #243627 0%, #152018 55%, #0c130f 100%);
      color: #f8f5ec;
    }
    .app-shell {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      padding-top: calc(5px + var(--safe-top));
      padding-bottom: calc(5px + var(--safe-bottom));
      padding-left: calc(6px + var(--safe-left));
      padding-right: calc(6px + var(--safe-right));
      gap: 6px;
      overflow: hidden;
    }
    .app-shell.zoom-pure {
      padding-top: calc(4px + var(--safe-top));
      padding-bottom: calc(4px + var(--safe-bottom));
      padding-left: calc(4px + var(--safe-left));
      padding-right: calc(4px + var(--safe-right));
      gap: 0;
    }

    /* Floating Exit-Zoom Pill (visible ONLY when in pure full-board zoom mode) */
    .floating-exit-zoom {
      position: fixed;
      top: calc(10px + var(--safe-top));
      right: calc(10px + var(--safe-right));
      z-index: 55;
      display: none;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      border-radius: 999px;
      border: 1.5px solid rgba(253, 224, 71, 0.75);
      background: rgba(15, 23, 42, 0.84);
      -webkit-backdrop-filter: blur(10px);
      backdrop-filter: blur(10px);
      color: #fef3c7;
      font-family: inherit;
      font-size: 12.5px;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.48);
      cursor: pointer;
    }
    .floating-exit-zoom.visible { display: inline-flex; }
    .floating-exit-zoom:active { transform: scale(0.95); }

    /* Top Toolbar */
    .top-bar {
      width: 100%;
      max-width: 1240px;
      margin: 0 auto;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      background: rgba(255, 250, 240, 0.1);
      -webkit-backdrop-filter: blur(12px);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 244, 219, 0.16);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.28);
      border-radius: 15px;
      padding: 5px 8px;
    }
    .brand { display: flex; align-items: center; gap: 7px; flex-shrink: 0; }
    .brand-logo {
      width: 32px; height: 32px; border-radius: 10px;
      background: linear-gradient(135deg, #1e3a8a 0%, #0f172a 100%);
      border: 1.5px solid rgba(251, 191, 36, 0.65);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35); flex-shrink: 0;
    }
    .brand-logo svg { width: 22px; height: 22px; }
    .brand-info { display: none; line-height: 1.15; }
    .brand-title { margin: 0; font-size: 14px; font-weight: 900; color: #fef3c7; display: flex; align-items: center; gap: 5px; }
    .ver-tag { font-size: 10px; font-weight: 800; padding: 1px 5px; border-radius: 6px; background: rgba(245, 158, 11, 0.25); color: #fde68a; border: 1px solid rgba(251, 191, 36, 0.35); }
    .brand-sub { margin: 0; font-size: 10.5px; color: rgba(254, 243, 199, 0.72); font-weight: 600; }

    .center-status { display: flex; align-items: center; gap: 5px; min-width: 0; }
    .turn-pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 4px 9px; border-radius: 999px;
      font-weight: 900; font-size: 12px;
      border: 1.5px solid rgba(248, 113, 113, 0.7);
      background: rgba(239, 68, 68, 0.24); color: #fee2e2;
      white-space: nowrap; transition: all 0.25s ease;
    }
    .turn-pill.p2-turn { border-color: rgba(96, 165, 250, 0.75); background: rgba(37, 99, 235, 0.28); color: #dbeafe; }
    .turn-pill.black-turn { border-color: rgba(203, 213, 225, 0.65); background: rgba(30, 41, 59, 0.78); color: #f1f5f9; }
    .turn-pill.white-turn { border-color: rgba(255, 255, 255, 0.85); background: rgba(248, 250, 252, 0.9); color: #0f172a; }
    .turn-pill.win-p1 { border-color: #f87171; background: #dc2626; color: #fff; }
    .turn-pill.win-p2 { border-color: #60a5fa; background: #2563eb; color: #fff; }
    .turn-dot { width: 8px; height: 8px; border-radius: 50%; background: #f87171; flex-shrink: 0; animation: pulseDot 1.4s infinite; }
    .turn-pill.p2-turn .turn-dot { background: #60a5fa; }
    .turn-pill.black-turn .turn-dot { background: #e2e8f0; }
    .turn-pill.white-turn .turn-dot { background: #0f172a; }
    .turn-pill.win-p1 .turn-dot, .turn-pill.win-p2 .turn-dot { background: #fde047; animation: none; }
    @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }

    .timer-pill {
      display: inline-flex; align-items: center; gap: 3px;
      padding: 4px 8px; border-radius: 999px;
      background: rgba(0, 0, 0, 0.38); border: 1px solid rgba(252, 211, 77, 0.32);
      color: #fde68a; font-size: 12px; font-weight: 900;
      font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    .actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .btn {
      appearance: none; -webkit-appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.12); color: #fffbeb;
      font-family: inherit; font-weight: 700; font-size: 11.5px;
      padding: 5px 7px; min-height: 30px; border-radius: 9px;
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      cursor: pointer; transition: transform 0.12s ease, background 0.2s ease, opacity 0.2s ease;
      white-space: nowrap;
    }
    .btn:active { transform: scale(0.94); }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-zoom { background: rgba(5, 150, 105, 0.88); border-color: rgba(110, 231, 183, 0.48); color: #fff; }
    .btn-save { background: rgba(37, 99, 235, 0.85); border-color: rgba(147, 197, 253, 0.45); color: #fff; }
    .btn-anim-on { background: rgba(124, 58, 237, 0.8); border-color: rgba(196, 181, 253, 0.45); color: #fff; }
    .btn-restart { background: #d97706; border-color: rgba(253, 224, 71, 0.35); color: #fff; }
    .btn-label { display: none; }
    .btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    /* Workspace (Fold 7 Adaptive) */
    .workspace {
      width: 100%; max-width: 1240px; margin: 0 auto;
      flex: 1 1 0%; min-height: 0;
      display: flex; flex-direction: column; gap: 6px; overflow: hidden;
    }

    /* 6-Game Navigation Bar (Scrollable Bottom Bar on Folded Phone, Vertical Rail on Unfolded Fold 7 / Desktop) */
    .game-nav {
      order: 2; flex-shrink: 0;
      display: flex; align-items: center; gap: 4px;
      background: rgba(255, 250, 240, 0.09);
      border: 1px solid rgba(255, 244, 219, 0.15);
      border-radius: 14px; padding: 4px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .game-nav::-webkit-scrollbar { display: none; }
    .nav-item {
      flex: 1 0 auto;
      appearance: none; -webkit-appearance: none;
      border: 1.5px solid transparent; background: transparent;
      color: rgba(254, 243, 199, 0.72);
      font-family: inherit; font-weight: 800; font-size: 11.5px;
      padding: 6px 8px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center; gap: 4px;
      cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
    }
    .nav-item.active {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.34), rgba(217, 119, 6, 0.24));
      border-color: rgba(251, 191, 36, 0.68); color: #fffbeb;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.24);
    }
    .nav-icon { font-size: 14px; line-height: 1; }

    /* Arena */
    .arena {
      order: 1; flex: 1 1 0%; min-height: 0; min-width: 0;
      display: flex; flex-direction: column; align-items: stretch; justify-content: space-between;
      gap: 5px; overflow: hidden;
    }

    /* Player HUD Cards */
    .player-card {
      background: rgba(255, 252, 245, 0.94); color: #2c241b;
      border: 2px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
      border-radius: 13px; padding: 5px 9px;
      flex-shrink: 0; display: flex; flex-direction: column; gap: 4px;
      transition: box-shadow 0.25s ease, border-color 0.25s ease, opacity 0.25s ease;
    }
    .player-card.p2-card { order: 1; transform: rotate(180deg); }
    .player-card.p1-card { order: 3; }
    .player-card.turn-glow-p1 { border-color: #ef4444; box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.35), 0 6px 20px rgba(220, 38, 38, 0.35); }
    .player-card.turn-glow-p2 { border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.35), 0 6px 20px rgba(37, 99, 235, 0.35); }
    .player-card.turn-glow-dark { border-color: #334155; box-shadow: 0 0 0 3px rgba(148, 163, 184, 0.45), 0 6px 20px rgba(15, 23, 42, 0.4); }
    .player-card.turn-glow-gold { border-color: #f59e0b; box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.45), 0 6px 20px rgba(217, 119, 6, 0.35); }
    .player-card.inactive { opacity: 0.82; }
    .hidden { display: none !important; }

    .card-header { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
    .side-title { display: flex; align-items: center; gap: 6px; font-weight: 900; font-size: 12.5px; }
    .side-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; border: 1px solid rgba(0,0,0,0.2); }
    .side-dot.red { background: #dc2626; }
    .side-dot.blue { background: #2563eb; }
    .side-dot.black { background: #0f172a; }
    .side-dot.white { background: #ffffff; }
    .side-dot.neutral { background: #64748b; }

    .card-meta { display: flex; align-items: center; gap: 5px; }
    .last-time { font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: #64748b; }
    .remain-badge { font-size: 11px; font-weight: 900; padding: 2px 7px; border-radius: 999px; background: #e2e8f0; color: #1e293b; }
    .remain-badge.red { background: #fee2e2; color: #991b1b; }
    .remain-badge.blue { background: #dbeafe; color: #1e40af; }

    .lost-row { display: flex; align-items: center; gap: 6px; min-height: 0; }
    .lost-label { font-size: 10.5px; font-weight: 700; color: #64748b; white-space: nowrap; flex-shrink: 0; }
    .lost-label .desktop-only { display: none; }
    .lost-count { font-weight: 900; margin-left: 2px; color: #334155; }

    .lost-tray {
      flex: 1 1 0%; min-height: 30px; border-radius: 9px; padding: 3px 5px;
      display: flex; flex-wrap: nowrap; align-items: center; gap: 4px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
      background: rgba(241, 245, 249, 0.9); border: 1px solid rgba(203, 213, 225, 0.85);
    }
    .lost-tray::-webkit-scrollbar { display: none; }
    .lost-tray.red { background: rgba(254, 242, 242, 0.9); border-color: rgba(254, 202, 202, 0.9); }
    .lost-tray.blue { background: rgba(239, 246, 255, 0.9); border-color: rgba(191, 219, 254, 0.9); }

    .empty-lost { font-size: 10.5px; color: #94a3b8; margin: 0 auto; white-space: nowrap; }
    .lost-chip {
      flex-shrink: 0; display: inline-flex; align-items: center; gap: 3px;
      padding: 2px 5px; border-radius: 7px; background: #fff;
      font-size: 11px; font-weight: 900; border: 1px solid #cbd5e1; color: #1e293b;
      box-shadow: 0 1px 2px rgba(0,0,0,0.08); animation: popIn 0.25s ease forwards;
    }
    .lost-chip.red { border-color: #fecaca; color: #991b1b; }
    .lost-chip.blue { border-color: #bfdbfe; color: #1e40af; }
    .lost-chip img { width: 19px; height: 19px; border-radius: 50%; display: block; }
    @keyframes popIn { 0% { transform: scale(0.45); opacity: 0; } 75% { transform: scale(1.08); opacity: 1; } 100% { transform: scale(1); opacity: 1; } }

    .ref-card { display: none; margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(120, 53, 15, 0.14); }
    .ref-title { font-size: 10.5px; font-weight: 700; color: rgba(120, 53, 15, 0.78); margin-bottom: 4px; }
    .ref-box { font-size: 11.5px; font-weight: 700; color: #451a03; background: rgba(254, 243, 199, 0.85); border-radius: 9px; padding: 6px; text-align: center; line-height: 1.5; }

    /* Center Board Stage */
    .board-stage {
      order: 2; flex: 1 1 0%; min-height: 0; min-width: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      overflow: hidden; gap: 4px;
    }
    .go-subbar {
      display: none; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0;
    }
    .go-subbar.visible { display: flex; }
    .sub-pill {
      appearance: none; -webkit-appearance: none;
      border: 1px solid rgba(254, 243, 199, 0.28);
      background: rgba(15, 23, 42, 0.55); color: #fef3c7;
      font-family: inherit; font-size: 11px; font-weight: 800;
      padding: 3px 9px; border-radius: 999px; cursor: pointer;
    }
    .sub-pill.active { background: #d97706; border-color: #fde68a; color: #fff; }
    .sub-pill.pass-btn { background: #0f766e; border-color: #5eead4; color: #fff; }

    .wood-frame {
      background: linear-gradient(145deg, #9a6432 0%, #6d411c 48%, #4d2c10 100%);
      box-shadow: 0 16px 38px rgba(0, 0, 0, 0.52), inset 0 2px 3px rgba(255, 224, 174, 0.45), inset 0 -3px 6px rgba(34, 16, 4, 0.65);
      border: 1.5px solid rgba(255, 218, 160, 0.28);
      border-radius: 16px; padding: 6px;
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.08s ease;
    }
    canvas#boardCanvas { display: block; border-radius: 10px; touch-action: none; cursor: pointer; }
    .status-hint {
      font-size: 11px; font-weight: 600; color: rgba(254, 243, 199, 0.85);
      text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      max-width: 100%; padding: 0 8px;
    }

    /* Modals & Toast */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 60;
      background: rgba(0, 0, 0, 0.68); display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-backdrop.open { display: flex; }
    .modal-box {
      background: #fffcf5; color: #451a03; border: 2px solid rgba(180, 83, 9, 0.35);
      border-radius: 20px; width: 100%; max-width: 440px; max-height: 86vh;
      overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 18px;
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
    }
    .modal-box.small { max-width: 320px; text-align: center; }
    .modal-box.victory { max-width: 350px; text-align: center; border: 4px solid #f59e0b; animation: popIn 0.3s ease; }
    .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .modal-title { margin: 0; font-size: 17px; font-weight: 900; color: #451a03; }
    .modal-close { width: 30px; height: 30px; border-radius: 50%; border: none; background: #fef3c7; color: #451a03; font-weight: 900; font-size: 14px; cursor: pointer; }
    .rules-list { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 9px; font-size: 13px; line-height: 1.55; }
    .modal-btn-row { display: flex; gap: 8px; margin-top: 14px; }
    .modal-btn { flex: 1; border: none; border-radius: 11px; padding: 10px 12px; font-family: inherit; font-weight: 800; font-size: 13.5px; cursor: pointer; }
    .modal-btn.primary { background: #92400e; color: #fff; }
    .modal-btn.blue { background: #2563eb; color: #fff; }
    .modal-btn.secondary { background: #fef3c7; color: #451a03; }
    .modal-btn.danger { background: #dc2626; color: #fff; }

    .save-input-row { display: flex; gap: 6px; margin-bottom: 12px; }
    .save-input {
      flex: 1; border: 1.5px solid #d6b67c; border-radius: 10px; padding: 8px 10px;
      font-family: inherit; font-size: 13.5px; font-weight: 700; color: #2c241b; background: #fff;
      -webkit-user-select: text; user-select: text;
    }
    .save-list { display: flex; flex-direction: column; gap: 8px; max-height: 260px; overflow-y: auto; margin-bottom: 10px; }
    .save-item {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      background: #fff8eb; border: 1px solid #e7cfa0; border-radius: 12px; padding: 8px 10px;
    }
    .save-item-info { min-width: 0; flex: 1; }
    .save-item-name { font-size: 13px; font-weight: 900; color: #451a03; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .save-item-meta { font-size: 11px; color: #78350f; margin-top: 2px; }
    .save-item-btns { display: flex; gap: 4px; flex-shrink: 0; }
    .mini-btn { border: none; border-radius: 8px; padding: 6px 9px; font-family: inherit; font-size: 11.5px; font-weight: 800; cursor: pointer; }
    .mini-btn.load { background: #059669; color: #fff; }
    .mini-btn.del { background: #fee2e2; color: #b91c1c; }

    .toast {
      position: fixed; bottom: calc(18px + var(--safe-bottom)); left: 50%; transform: translateX(-50%);
      z-index: 75; background: rgba(15, 23, 42, 0.92); color: #fef3c7;
      border: 1px solid rgba(252, 211, 77, 0.35); border-radius: 999px;
      padding: 8px 16px; font-size: 12px; font-weight: 700; max-width: 92vw;
      text-align: center; box-shadow: 0 10px 24px rgba(0,0,0,0.42); pointer-events: none;
    }

    /* Unfolded Galaxy Z Fold 7 & Tablet (600px - 1023px): Left NavigationRail */
    @media (min-width: 600px) {
      .brand-info { display: block; }
      .btn-label { display: inline; }
      .btn { padding: 6px 9px; font-size: 12px; }
      .workspace { flex-direction: row; gap: 8px; }
      .game-nav {
        order: 1; flex-direction: column; justify-content: flex-start;
        width: 84px; padding: 6px 5px; gap: 5px;
        overflow-x: hidden; overflow-y: auto;
      }
      .nav-item { flex: 0 0 auto; width: 100%; flex-direction: column; padding: 8px 4px; font-size: 11px; gap: 3px; }
      .nav-icon { font-size: 18px; }
      .arena { order: 2; }
      .wood-frame { padding: 8px; }
    }

    /* Desktop & Wide Tablet (>= 1024px) */
    @media (min-width: 1024px) {
      .app-shell { padding: 10px 14px; gap: 8px; }
      .arena { flex-direction: row; align-items: stretch; justify-content: center; gap: 12px; }
      .player-card { width: 220px; align-self: center; height: 100%; max-height: 660px; padding: 12px; gap: 8px; }
      .player-card.p2-card { transform: none; }
      .lost-row { flex-direction: column; align-items: stretch; flex: 1 1 0%; }
      .lost-label { display: flex; justify-content: space-between; align-items: center; }
      .lost-label .desktop-only { display: inline; }
      .lost-tray { flex-wrap: wrap; align-items: flex-start; align-content: flex-start; overflow-x: hidden; overflow-y: auto; padding: 7px; gap: 5px; }
      .ref-card { display: block; }
    }
  </style>
</head>
<body>
  <div id="appShell" class="app-shell">

    <!-- Floating Exit-Zoom Pill (Only shown when entire UI is hidden in pure-board zoom mode) -->
    <button id="btnExitZoomFloat" type="button" class="floating-exit-zoom" title="還原介面與雙方資訊">
      ↙ 顯示介面
    </button>

    <!-- Top Toolbar -->
    <header id="topBar" class="top-bar">
      <div class="brand">
        <div class="brand-logo" title="親子棋館 航天棋藝 Logo">
          <svg viewBox="0 0 64 64" fill="none">
            <defs>
              <linearGradient id="lgBg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#1e3a8a"/><stop offset="55%" stop-color="#0f172a"/><stop offset="100%" stop-color="#064e3b"/>
              </linearGradient>
              <linearGradient id="lgGold" x1="16" y1="8" x2="48" y2="56" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#fef08a"/><stop offset="50%" stop-color="#f59e0b"/><stop offset="100%" stop-color="#b45309"/>
              </linearGradient>
              <linearGradient id="lgShip" x1="32" y1="9" x2="32" y2="44" gradientUnits="userSpaceOnUse">
                <stop offset="0%" stop-color="#ffffff"/><stop offset="100%" stop-color="#fde68a"/>
              </linearGradient>
            </defs>

<script>
(function () {
  'use strict';

  const FONT_STACK = '"PingFang HK", -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif';
  const SAVE_STORAGE_KEY = 'family_chess_suite_saves_v1';

  // ==================== GLOBAL STATE ====================
  let currentGame = 'jungle'; // 'jungle' | 'xiangqi' | 'banqi' | 'chess' | 'go' | 'othello'
  let animationsEnabled = true;
  let soundEnabled = true;
  let boardZoomMode = false;
  let chessPieceStyle = '3d'; // '3d' | 'flat' 

  const games = { jungle: null, xiangqi: null, banqi: null, chess: null, go: null, othello: null };

  // Visual effects
  let activeAnim = null;
  let flipAnims = []; // for Othello cascading flips
  let particles = [];
  let ripples = [];
  let slashes = [];
  let pawPrints = [];
  let floatingTexts = [];
  let shakeUntil = 0;
  let shakeIntensity = 0;
  let rafId = null;

  const canvas = document.getElementById('boardCanvas');
  const ctx = canvas.getContext('2d');
  let cellSize = 50;
  let boardPad = 10;
  let dpr = 1;
  let timerIntervalId = null;

  // ==================== WEB AUDIO SYNTHESIZER ====================
  let audioCtx = null, audioUnlocked = false;
  function ensureAudio() {
    if (!soundEnabled) return null;
    try {
      if (!audioCtx) { const Ctx = window.AudioContext || window.webkitAudioContext; if (Ctx) audioCtx = new Ctx(); }
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      if (audioCtx && !audioUnlocked) {
        const b = audioCtx.createBuffer(1, 1, 22050), s = audioCtx.createBufferSource();
        s.buffer = b; s.connect(audioCtx.destination); s.start(0); audioUnlocked = true;
      }
    } catch (_) { return null; }
    return audioCtx;
  }

  function playSound(type) {
    const ac = ensureAudio();
    if (!ac) return;
    try {
      const now = ac.currentTime;
      const tone = (tp, f1, f2, dur, vol, delay = 0) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = tp; o.frequency.setValueAtTime(f1, now + delay);
        if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(f2, now + delay + dur);
        g.gain.setValueAtTime(vol, now + delay);
        g.gain.exponentialRampToValueAtTime(0.001, now + delay + dur + 0.02);
        o.connect(g).connect(ac.destination); o.start(now + delay); o.stop(now + delay + dur + 0.03);
      };
      if (type === 'select') tone('sine', 520, 720, 0.06, 0.11);
      else if (type === 'walk') tone('triangle', 220, 115, 0.09, 0.22);
      else if (type === 'stone') tone('triangle', 480, 190, 0.06, 0.26);
      else if (type === 'stomp') tone('sine', 130, 38, 0.24, 0.38);
      else if (type === 'jump') { tone('sine', 210, 620, 0.18, 0.16); tone('sine', 620, 175, 0.22, 0.14, 0.18); }
      else if (type === 'slash') tone('sawtooth', 520, 140, 0.18, 0.13);
      else if (type === 'flip') tone('triangle', 340, 640, 0.1, 0.16);
      else if (type === 'capture') [330, 440, 620].forEach((f, i) => tone('triangle', f, f, 0.12, 0.17, i * 0.045));
      else if (type === 'check' || type === 'trap') tone('sawtooth', 420, 230, 0.22, 0.13);
      else if (type === 'win') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone('triangle', f, f, 0.32, 0.2, i * 0.11));
      else if (type === 'splash') {
        const sz = Math.floor(ac.sampleRate * 0.24);
        const buf = ac.createBuffer(1, sz, ac.sampleRate);
        const d = buf.getChannelData(0);
        for (let i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sz * 0.34));
        const n = ac.createBufferSource(); n.buffer = buf;
        const f = ac.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(920, now); f.frequency.exponentialRampToValueAtTime(340, now + 0.22); f.Q.value = 1.4;
        const g = ac.createGain(); g.gain.setValueAtTime(0.3, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
        n.connect(f).connect(g).connect(ac.destination); n.start(now); n.stop(now + 0.24);
      }
    } catch (_) {}
  }

  // ==================== SHARED UTILITIES ====================
  function formatDuration(sec) {
    const s = Math.max(0, Math.floor(sec || 0));
    return `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }
  function formatDateNow() {
    const d = new Date(), p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
  }
  let toastTimer = null;
  function showToast(msg) {
    const el = document.getElementById('toastMsg');
    el.textContent = msg; el.classList.remove('hidden');
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.add('hidden'), 2800);
  }
  function drawRoundedRect(c2d, x, y, w, h, rad) {
    const rr = Math.min(rad, w / 2, h / 2);
    c2d.beginPath();
    c2d.moveTo(x + rr, y); c2d.arcTo(x + w, y, x + w, y + h, rr);
    c2d.arcTo(x + w, y + h, x, y + h, rr); c2d.arcTo(x, y + h, x, y, rr);
    c2d.arcTo(x, y, x + w, y, rr); c2d.closePath();
  }
  function getActiveState() { return games[currentGame]; }
  function updateTimerDisplay() {
    const st = getActiveState();
    const el = document.getElementById('moveTimerText');
    if (!st || !st.timerRunning || st.gameOver) {
      el.textContent = st && st.gameOver && st.finalElapsed ? formatDuration(st.finalElapsed) : '00:00';
      return;
    }
    el.textContent = formatDuration((Date.now() - st.turnStartTs) / 1000);
  }
  function startTurnTimer(st) { st.timerRunning = true; st.turnStartTs = Date.now(); updateTimerDisplay(); }
  function recordTurnElapsed(st, slot) { if (st.timerRunning) st.lastMoveDurationSec[slot] = Math.floor((Date.now() - st.turnStartTs) / 1000); }
  function snapshotForUndo(st) {
    const copy = { ...st };
    delete copy.history; delete copy.selectedId; delete copy.validMoves;
    return JSON.parse(JSON.stringify(copy));
  }

  // ==================== 1. 鬥獸棋 (JUNGLE) ====================
  const ANIMALS = {
    8: { rank: 8, name: '象', title: '大象' }, 7: { rank: 7, name: '獅', title: '獅子' },
    6: { rank: 6, name: '虎', title: '老虎' }, 5: { rank: 5, name: '豹', title: '花豹' },
    4: { rank: 4, name: '狼', title: '野狼' }, 3: { rank: 3, name: '狗', title: '獵狗' },
    2: { rank: 2, name: '貓', title: '小貓' }, 1: { rank: 1, name: '鼠', title: '老鼠' }
  };
  const J_BLUE_TRAPS = [{c:2,r:0},{c:4,r:0},{c:3,r:1}], J_RED_TRAPS = [{c:2,r:8},{c:4,r:8},{c:3,r:7}];
  function jIsRiver(c, r) { return (r >= 3 && r <= 5) && ((c === 1 || c === 2) || (c === 4 || c === 5)); }
  function jIsDen(c, r, side) {
    if (side === 'blue') return c === 3 && r === 0;
    if (side === 'red') return c === 3 && r === 8;
    return (c === 3 && r === 0) || (c === 3 && r === 8);
  }
  function jIsTrap(c, r, side) {
    if (side === 'blue') return J_BLUE_TRAPS.some(t => t.c === c && t.r === r);
    if (side === 'red') return J_RED_TRAPS.some(t => t.c === c && t.r === r);
    return J_BLUE_TRAPS.some(t => t.c === c && t.r === r) || J_RED_TRAPS.some(t => t.c === c && t.r === r);
  }
  function createJungleState() {
    let id = 1; const mk = (side, rank, c, r) => ({ id: id++, side, rank, c, r });
    return {
      pieces: [
        mk('blue',7,0,0), mk('blue',6,6,0), mk('blue',3,1,1), mk('blue',2,5,1),
        mk('blue',1,0,2), mk('blue',5,2,2), mk('blue',4,4,2), mk('blue',8,6,2),
        mk('red',8,0,6),  mk('red',4,2,6),  mk('red',5,4,6),  mk('red',1,6,6),
        mk('red',2,1,7),  mk('red',3,5,7),  mk('red',6,0,8),  mk('red',7,6,8)
      ],
      capturedP1: [], capturedP2: [], turn: 'red', selectedId: null, validMoves: [], lastMove: null,
      history: [], gameOver: false, winner: null, timerRunning: false, turnStartTs: 0, finalElapsed: 0,
      lastMoveDurationSec: { p1: null, p2: null }
    };
  }
  function jCanCapture(att, def, fc, fr, tc, tr) {
    if (!def || att.side === def.side) return false;
    if (jIsRiver(fc, fr) !== jIsRiver(tc, tr)) return false;
    if (jIsTrap(tc, tr, att.side)) return true;
    if (att.rank === 1 && def.rank === 8) return true;
    if (att.rank === 8 && def.rank === 1) return false;
    return att.rank >= def.rank;
  }
  function jGetValidMoves(piece, list) {
    const moves = [];
    for (const [dc, dr] of [[0,-1],[0,1],[-1,0],[1,0]]) {
      const nc = piece.c + dc, nr = piece.r + dr;
      if (nc < 0 || nc >= 7 || nr < 0 || nr >= 9 || jIsDen(nc, nr, piece.side)) continue;
      if (jIsRiver(nc, nr)) {
        if (piece.rank === 1) {
          const t = list.find(p => p.c === nc && p.r === nr);
          if (!t) moves.push({ c: nc, r: nr, kind: jIsRiver(piece.c, piece.r) ? 'swim' : 'splashIn', capture: null });
          else if (jCanCapture(piece, t, piece.c, piece.r, nc, nr)) moves.push({ c: nc, r: nr, kind: 'swim', capture: t });
        } else if (piece.rank === 7 || piece.rank === 6) {
          let jc = nc, jr = nr, blk = false;
          while (jc >= 0 && jc < 7 && jr >= 0 && jr < 9 && jIsRiver(jc, jr)) {
            if (list.find(p => p.c === jc && p.r === jr)) { blk = true; break; }
            jc += dc; jr += dr;
          }
          if (!blk && jc >= 0 && jc < 7 && jr >= 0 && jr < 9 && !jIsRiver(jc, jr) && !jIsDen(jc, jr, piece.side)) {
            const t = list.find(p => p.c === jc && p.r === jr);
            if (!t) moves.push({ c: jc, r: jr, kind: 'jump', capture: null });
            else if (jCanCapture(piece, t, piece.c, piece.r, jc, jr)) moves.push({ c: jc, r: jr, kind: 'jump', capture: t });
          }
        }
      } else {
        const t = list.find(p => p.c === nc && p.r === nr);
        const lv = jIsRiver(piece.c, piece.r);
        if (!t) moves.push({ c: nc, r: nr, kind: lv ? 'splashOut' : 'walk', capture: null });
        else if (jCanCapture(piece, t, piece.c, piece.r, nc, nr)) moves.push({ c: nc, r: nr, kind: lv ? 'splashOut' : 'walk', capture: t });
      }
    }
    return moves;
  }

  // ==================== 2. 中國象棋 (XIANGQI) ====================
  const X_LABELS = {
    red:   { K: '帥', A: '仕', E: '相', H: '傌', R: '俥', C: '炮', P: '兵' },
    black: { K: '將', A: '士', E: '象', H: '馬', R: '車', C: '砲', P: '卒' }
  };

  function createXiangqiState() {

    shakeUntil = performance.now() + 240; shakeIntensity = 5.5;
    ripples.push({ x, y, r: cellSize * 0.2, maxR: cellSize * 1.05, alpha: 0.9, color: '#92400e' });
    ripples.push({ x, y, r: cellSize * 0.1, maxR: cellSize * 0.72, alpha: 0.85, color: '#fbbf24' });
    for (let i = 0; i < 18; i++) {
      const a = (Math.PI * 2 * i) / 18, sp = 1.4 + Math.random() * 2.6;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.6, gravity: 0.09, size: 3.5 + Math.random() * 4, color: i % 2 === 0 ? '#a8a29e' : '#d6b67c', life: 1, decay: 0.025 + Math.random() * 0.014 });
    }
  }
  function spawnClawSlash(x1, y1, x2, y2, color) { if (animationsEnabled) slashes.push({ x1, y1, x2, y2, color: color || '#fb923c', life: 1, decay: 0.045 }); }
  function spawnPawPrint(x, y) { if (animationsEnabled) pawPrints.push({ x, y, life: 0.85, decay: 0.022 }); }
  function spawnDust(x, y, color = '#d6c39b', n = 10) {
    if (!animationsEnabled) return;
    ripples.push({ x, y, r: cellSize * 0.16, maxR: cellSize * 0.62, alpha: 0.65, color });
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 0.8 + Math.random() * 2.0;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.4, gravity: 0.04, size: 2.4 + Math.random() * 2.8, color, life: 1, decay: 0.034 + Math.random() * 0.015 });
    }
  }
  function spawnCaptureBurst(x, y, isWarm) {
    if (!animationsEnabled) return;
    const cols = isWarm ? ['#ef4444','#fca5a5','#fde047','#fff'] : ['#3b82f6','#93c5fd','#fde047','#fff'];
    ripples.push({ x, y, r: cellSize * 0.15, maxR: cellSize * 0.88, alpha: 0.9, color: '#facc15' });
    for (let i = 0; i < 20; i++) {
      const a = (Math.PI * 2 * i) / 20 + (Math.random() - 0.5) * 0.3, sp = 1.8 + Math.random() * 3.4;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.8, gravity: 0.08, size: 3 + Math.random() * 3.6, color: cols[i % cols.length], life: 1, decay: 0.025 + Math.random() * 0.015 });
    }
  }
  function spawnFloatingText(x, y, text, color = '#991b1b') {
    if (!animationsEnabled && text !== '將軍！' && text !== 'Check!') return;
    floatingTexts.push({ x, y, vy: -0.9, text, color, life: 1, decay: 0.018 });
  }

  // ==================== MOVE EXECUTION FOR ALL 6 GAMES ====================
  function executePieceMove(piece, move) {
    const st = getActiveState();
    const slot = currentGame === 'banqi' ? st.turn : ((st.turn === 'red' || st.turn === 'white') ? 'p1' : 'p2');
    recordTurnElapsed(st, slot);
    st.history.push(snapshotForUndo(st));

    const fromC = piece.c, fromR = piece.r, toC = move.c, toR = move.r;
    const victim = move.capture ? st.pieces.find(p => p.id === move.capture.id) : null;
    st.selectedId = null; st.validMoves = [];

    if (!animationsEnabled) {
      finalizePieceMove(st, piece, fromC, fromR, toC, toR, move, victim);
      return;
    }

    let duration = 240, animStyle = move.kind;
    if (currentGame === 'jungle') {
      if (move.kind === 'jump') {
        duration = 540; animStyle = piece.rank === 6 ? 'tigerJump' : 'lionJump'; playSound('jump');
        const mid = cellCenter((fromC + toC) / 2, (fromR + toR) / 2);
        spawnFloatingText(mid.x, mid.y - cellSize * 0.28, piece.rank === 7 ? '獅躍跳河！' : '猛虎跳河！', '#b45309');
      } else if (move.kind === 'splashIn') { duration = 390; animStyle = 'splashIn'; playSound('splash'); }
      else if (move.kind === 'splashOut') { duration = 350; animStyle = 'splashOut'; playSound('splash'); const sPt = cellCenter(fromC, fromR); spawnSplash(sPt.x, sPt.y, 12); }
      else if (move.kind === 'swim') { duration = 300; animStyle = 'ratSwim'; }
      else {
        const m = { 8:['elephantStomp',420], 7:['lionBound',340], 6:['tigerPounce',320], 5:['leopardDash',210], 4:['wolfProwl',270], 3:['dogBounce',340], 2:['catGlide',280], 1:['ratScurry',250] };
        [animStyle, duration] = m[piece.rank] || ['walk', 260];
        if (piece.rank === 6) { playSound('slash'); const p1 = cellCenter(fromC, fromR), p2 = cellCenter(toC, toR); spawnClawSlash(p1.x, p1.y, p2.x, p2.y, '#f97316'); }
        else if (piece.rank === 4) { const p1 = cellCenter(fromC, fromR), p2 = cellCenter(toC, toR); spawnClawSlash(p1.x, p1.y, p2.x, p2.y, '#94a3b8'); }
        else if (piece.rank === 2) { const p1 = cellCenter(fromC, fromR); spawnPawPrint(p1.x, p1.y); }
      }
    } else if (move.kind === 'jump') { duration = 360; playSound('jump'); }

    activeAnim = { game: currentGame, mode: 'move', pieceId: piece.id, fromC, fromR, toC, toR, move, animStyle, victim, startTime: performance.now(), duration };
  }

  function finalizePieceMove(st, piece, fromC, fromR, toC, toR, move, victim) {
    piece.c = toC; piece.r = toR;
    if ('moved' in piece) piece.moved = true;
    st.lastMove = { fromC, fromR, toC, toR };
    const endPt = cellCenter(toC, toR);

    if (currentGame === 'jungle') {
      if (move.kind === 'splashIn') { spawnSplash(endPt.x, endPt.y, 20); spawnFloatingText(endPt.x, endPt.y - cellSize * 0.35, '落水！', '#0369a1'); }
      else if (move.kind === 'swim') { if (animationsEnabled) ripples.push({ x: endPt.x, y: endPt.y, r: cellSize * 0.12, maxR: cellSize * 0.56, alpha: 0.78, color: '#bae6fd' }); playSound('splash'); }
      else if (piece.rank === 8) { spawnElephantStomp(endPt.x, endPt.y); if (!victim) playSound('stomp'); spawnFloatingText(endPt.x, endPt.y - cellSize * 0.38, '轟！', '#78350f'); }
      else if (move.kind === 'jump') { spawnDust(endPt.x, endPt.y, '#fbbf24', 16); if (!victim) playSound('walk'); }
      else { spawnDust(endPt.x, endPt.y, '#c9b58b', 7); if (!victim) playSound('walk'); }
    } else {
      spawnDust(endPt.x, endPt.y, '#d6b67c', 7);
      if (!victim) playSound('walk');
    }

    // Chess special moves: Castling, En Passant, Promotion
    if (currentGame === 'chess') {
      if (move.castle === 'K') {
        const rk = st.pieces.find(p => p.side === piece.side && p.type === 'R' && p.c === 7 && p.r === piece.r);
        if (rk) { rk.c = 5; rk.moved = true; spawnFloatingText(endPt.x, endPt.y - cellSize * 0.4, '王車易位！', '#b45309'); }
      } else if (move.castle === 'Q') {
        const rk = st.pieces.find(p => p.side === piece.side && p.type === 'R' && p.c === 0 && p.r === piece.r);
        if (rk) { rk.c = 3; rk.moved = true; spawnFloatingText(endPt.x, endPt.y - cellSize * 0.4, '王車易位！', '#b45309'); }
      }
      st.enPassant = move.doublePawn ? { c: toC, r: (fromR + toR) / 2 } : null;
      if (piece.type === 'P' && (toR === 0 || toR === 7)) {
        piece.type = 'Q';
        spawnFloatingText(endPt.x, endPt.y - cellSize * 0.42, '升變皇后！', '#7e22ce');
      }
    }

    // Capture handling
    if (victim) {
      st.pieces = st.pieces.filter(p => p.id !== victim.id);
      if (currentGame === 'jungle') {
        if (victim.side === 'red') { st.capturedP1.push(victim); st.capturedP1.sort((a,b) => b.rank - a.rank); }
        else { st.capturedP2.push(victim); st.capturedP2.sort((a,b) => b.rank - a.rank); }
        playSound('capture'); spawnCaptureBurst(endPt.x, endPt.y, victim.side === 'red');
        spawnFloatingText(endPt.x, endPt.y - cellSize * 0.42, (piece.rank === 1 && victim.rank === 8) ? '鼠食象！' : `食咗 ${ANIMALS[victim.rank].name}！`, piece.side === 'red' ? '#b91c1c' : '#1d4ed8');
      } else if (currentGame === 'xiangqi') {
        if (victim.side === 'red') { st.capturedP1.push(victim); st.capturedP1.sort((a,b) => X_ORDER[b.type] - X_ORDER[a.type]); }
        else { st.capturedP2.push(victim); st.capturedP2.sort((a,b) => X_ORDER[b.type] - X_ORDER[a.type]); }
        playSound('capture'); spawnCaptureBurst(endPt.x, endPt.y, victim.side === 'red');
        spawnFloatingText(endPt.x, endPt.y - cellSize * 0.42, `食 ${X_LABELS[victim.side][victim.type]}！`, piece.side === 'red' ? '#b91c1c' : '#1e293b');
      } else if (currentGame === 'banqi') {
        if (victim.side === st.p1Color) { st.capturedP1.push(victim); st.capturedP1.sort((a,b) => b.rank - a.rank); }
        else { st.capturedP2.push(victim); st.capturedP2.sort((a,b) => b.rank - a.rank); }
        playSound('capture'); spawnCaptureBurst(endPt.x, endPt.y, victim.side === 'red');
        spawnFloatingText(endPt.x, endPt.y - cellSize * 0.4, `食 ${X_LABELS[victim.side][victim.type]}！`, piece.side === 'red' ? '#b91c1c' : '#1e293b');
      } else if (currentGame === 'chess') {
        if (victim.side === 'white') { st.capturedP1.push(victim); st.capturedP1.sort((a,b) => C_ORDER[b.type] - C_ORDER[a.type]); }
        else { st.capturedP2.push(victim); st.capturedP2.sort((a,b) => C_ORDER[b.type] - C_ORDER[a.type]); }
        playSound('capture'); spawnCaptureBurst(endPt.x, endPt.y, victim.side === 'white');
      }
    }

    // Turn switch & win conditions
    if (currentGame === 'jungle') {
      const opp = piece.side === 'red' ? 'blue' : 'red';
      if (jIsTrap(piece.c, piece.r, opp)) { playSound('trap'); spawnFloatingText(endPt.x, endPt.y - cellSize * 0.18, '中陷阱！', '#7e22ce'); }
      if (jIsDen(piece.c, piece.r, opp)) return triggerWin(st, piece.side === 'red' ? 'p1' : 'p2', `${piece.side === 'red' ? '紅方' : '藍方'}嘅${ANIMALS[piece.rank].title}成功攻入對方獸穴！`);
      if (!st.pieces.some(p => p.side === opp)) return triggerWin(st, piece.side === 'red' ? 'p1' : 'p2', `${piece.side === 'red' ? '紅方' : '藍方'}食曬對方所有棋子！`);
      st.turn = opp;
      if (!st.pieces.some(p => p.side === opp && jGetValidMoves(p, st.pieces).length > 0)) return triggerWin(st, piece.side === 'red' ? 'p1' : 'p2', `${opp === 'red' ? '紅方' : '藍方'}已無棋可行！`);
    } else if (currentGame === 'xiangqi') {
      const opp = piece.side === 'red' ? 'black' : 'red';
      if (!st.pieces.find(p => p.side === opp && p.type === 'K')) return triggerWin(st, piece.side === 'red' ? 'p1' : 'p2', `${piece.side === 'red' ? '紅方' : '黑方'}成功擒獲對方主帥！`);
      st.turn = opp;
      const hasM = st.pieces.some(p => p.side === opp && xGetValidMoves(p, st.pieces).length > 0);
      if (!hasM) return triggerWin(st, piece.side === 'red' ? 'p1' : 'p2', xIsInCheck(opp, st.pieces) ? `${piece.side === 'red' ? '紅方' : '黑方'}絕殺將死！` : `${opp === 'red' ? '紅方' : '黑方'}無子可動，判負！`);
      if (xIsInCheck(opp, st.pieces)) {
        playSound('check'); const k = st.pieces.find(p => p.side === opp && p.type === 'K');
        if (k) { const kp = cellCenter(k.c, k.r); spawnFloatingText(kp.x, kp.y - cellSize * 0.45, '將軍！', '#dc2626'); }
      }
    } else if (currentGame === 'banqi') {
      const nxt = st.turn === 'p1' ? 'p2' : 'p1', oppCol = nxt === 'p1' ? st.p1Color : st.p2Color;
      if (!st.pieces.some(p => p.side === oppCol)) return triggerWin(st, st.turn, `${st.turn === 'p1' ? '下方玩家' : '上方玩家'}食曬對方所有棋子！`);
      st.turn = nxt;
      if (!bHasAnyMove(st, st.turn)) { const w = st.turn === 'p1' ? 'p2' : 'p1'; return triggerWin(st, w, `${st.turn === 'p1' ? '下方玩家' : '上方玩家'}無棋可行！`); }
    } else if (currentGame === 'chess') {
      const opp = piece.side === 'white' ? 'black' : 'white';
      st.turn = opp;
      const hasM = st.pieces.some(p => p.side === opp && cGetValidMoves(p, st.pieces, st.enPassant).length > 0);
      const inChk = cIsInCheck(opp, st.pieces);
      if (!hasM) {
        if (inChk) return triggerWin(st, piece.side === 'white' ? 'p1' : 'p2', `${piece.side === 'white' ? '白方' : '黑方'}將死對方（Checkmate）！`);
        return triggerWin(st, 'draw', '雙方逼和（Stalemate）！');
      }
      if (inChk) {
        playSound('check'); const k = st.pieces.find(p => p.side === opp && p.type === 'K');
        if (k) { const kp = cellCenter(k.c, k.r); spawnFloatingText(kp.x, kp.y - cellSize * 0.45, '將軍！', '#dc2626'); }
      }
    }

    startTurnTimer(st);
    updateUI();
  }

  function executeBanqiFlip(piece) {
    const st = games.banqi;
    recordTurnElapsed(st, st.turn);
    st.history.push(snapshotForUndo(st));
    st.selectedId = null; st.validMoves = [];
    if (!animationsEnabled) { finalizeBanqiFlip(st, piece); return; }
    playSound('flip');
    activeAnim = { game: 'banqi', mode: 'flip', pieceId: piece.id, fromC: piece.c, fromR: piece.r, toC: piece.c, toR: piece.r, startTime: performance.now(), duration: 280 };
  }
  function finalizeBanqiFlip(st, piece) {
    piece.faceUp = true; st.lastMove = { fromC: piece.c, fromR: piece.r, toC: piece.c, toR: piece.r };
    const pt = cellCenter(piece.c, piece.r); spawnDust(pt.x, pt.y, '#fde68a', 8);
    if (!st.p1Color) {
      if (st.turn === 'p1') { st.p1Color = piece.side; st.p2Color = piece.side === 'red' ? 'black' : 'red'; }
      else { st.p2Color = piece.side; st.p1Color = piece.side === 'red' ? 'black' : 'red'; }
      spawnFloatingText(pt.x, pt.y - cellSize * 0.3, piece.side === 'red' ? '下方執紅！' : '下方執黑！', piece.side === 'red' ? '#b91c1c' : '#1e293b');
    }
    st.turn = st.turn === 'p1' ? 'p2' : 'p1';
    if (!bHasAnyMove(st, st.turn)) { const w = st.turn === 'p1' ? 'p2' : 'p1'; return triggerWin(st, w, `${w === 'p1' ? '下方玩家' : '上方玩家'}勝出（對方無棋可行）！`); }
    startTurnTimer(st); updateUI();
  }

  function executeGoMove(c, r) {
    const st = games.go;
    const res = goTryPlace(st, c, r);
    if (!res) return;
    recordTurnElapsed(st, st.turn === 'black' ? 'p1' : 'p2');
    st.history.push(snapshotForUndo(st));
    st.board = res.nextBoard;
    st.koPoint = res.newKo;
    st.consecutivePasses = 0;
    st.lastMove = { fromC: c, fromR: r, toC: c, toR: r };
    const pt = cellCenter(c, r);
    playSound('stone');
    spawnDust(pt.x, pt.y, st.turn === 'black' ? '#475569' : '#f8fafc', 6);
    if (res.captured.length > 0) {
      if (st.turn === 'black') st.capturedByBlack += res.captured.length;
      else st.capturedByWhite += res.captured.length;
      playSound('capture');
      res.captured.forEach(s => { const sp = cellCenter(s.c, s.r); spawnCaptureBurst(sp.x, sp.y, st.turn === 'black'); });
      spawnFloatingText(pt.x, pt.y - cellSize * 0.4, `提 ${res.captured.length} 子！`, '#b45309');
    }
    st.turn = st.turn === 'black' ? 'white' : 'black';
    startTurnTimer(st);
    updateUI();
  }

  function executeGoPass() {
    const st = games.go;
    if (st.gameOver) return;
    recordTurnElapsed(st, st.turn === 'black' ? 'p1' : 'p2');
    st.history.push(snapshotForUndo(st));
    st.consecutivePasses++;
    st.koPoint = null;
    playSound('select');
    if (st.consecutivePasses >= 2) {
      const sc = goScoreArea(st);
      const winSlot = sc.blackPts > sc.whitePts ? 'p1' : 'p2';
      triggerWin(st, winSlot, `雙方連續虛手終局！黑方 ${sc.blackPts} 目 vs 白方 ${sc.whitePts} 目（含貼目 ${sc.komi}）。`);
      return;
    }
    showToast(`${st.turn === 'black' ? '黑方' : '白方'}選擇虛手（再虛手一次將點目終局）`);
    st.turn = st.turn === 'black' ? 'white' : 'black';
    startTurnTimer(st);
    updateUI();
  }

  function executeOthelloMove(c, r) {
    const st = games.othello;
    const flips = oGetFlips(st.board, c, r, st.turn);
    if (flips.length === 0) return;
    recordTurnElapsed(st, st.turn === 'black' ? 'p1' : 'p2');
    st.history.push(snapshotForUndo(st));

    const myColor = st.turn, opp = myColor === 'black' ? 'white' : 'black';
    st.board[r][c] = myColor;
    flips.forEach((f, idx) => {
      st.board[f.r][f.c] = myColor;
      if (animationsEnabled) {
        flipAnims.push({ c: f.c, r: f.r, from: opp, to: myColor, startTime: performance.now() + idx * 45, duration: 280 });
      }
    });
    st.lastMove = { fromC: c, fromR: r, toC: c, toR: r };
    const pt = cellCenter(c, r);
    playSound(flips.length >= 3 ? 'capture' : 'flip');
    spawnDust(pt.x, pt.y, '#fde68a', 8);
    if (flips.length >= 3) spawnFloatingText(pt.x, pt.y - cellSize * 0.35, `反轉 ${flips.length} 隻！`, '#fde047');

    const oppMoves = oGetAllValidMoves(st.board, opp);
    const myMoves = oGetAllValidMoves(st.board, myColor);
    if (oppMoves.length > 0) {
      st.turn = opp;
    } else if (myMoves.length > 0) {
      showToast(`${opp === 'black' ? '黑方' : '白方'}無步可行，由${myColor === 'black' ? '黑方' : '白方'}繼續！`);
    } else {
      const cnt = oCountDiscs(st.board);
      const w = cnt.black > cnt.white ? 'p1' : (cnt.white > cnt.black ? 'p2' : 'draw');
      triggerWin(st, w, `終局結算：黑棋 ${cnt.black} 隻 vs 白棋 ${cnt.white} 隻！`);
      return;
    }
    startTurnTimer(st);
    updateUI();
  }

  function triggerWin(st, winSlot, reason) {
    st.gameOver = true; st.winner = winSlot;
    st.finalElapsed = st.timerRunning ? Math.floor((Date.now() - st.turnStartTs) / 1000) : 0;
    st.timerRunning = false;
    playSound('win'); updateUI();
    const tEl = document.getElementById('victoryTitle');
    if (winSlot === 'draw') { tEl.textContent = '雙方和局！'; tEl.style.color = '#b45309'; }
    else if (currentGame === 'jungle') { tEl.textContent = winSlot === 'p1' ? '紅方勝出！' : '藍方勝出！'; tEl.style.color = winSlot === 'p1' ? '#b91c1c' : '#1d4ed8'; }
    else if (currentGame === 'xiangqi') { tEl.textContent = winSlot === 'p1' ? '紅方勝出！' : '黑方勝出！'; tEl.style.color = winSlot === 'p1' ? '#b91c1c' : '#1e293b'; }
    else if (currentGame === 'banqi') { tEl.textContent = winSlot === 'p1' ? '下方玩家勝出！' : '上方玩家勝出！'; tEl.style.color = '#b45309'; }
    else if (currentGame === 'chess') { tEl.textContent = winSlot === 'p1' ? '白方勝出！' : '黑方勝出！'; tEl.style.color = '#1e293b'; }
    else { tEl.textContent = winSlot === 'p1' ? '黑方勝出！' : '白方勝出！'; tEl.style.color = '#1e293b'; }
    document.getElementById('victoryReason').textContent = reason;
    document.getElementById('victoryModal').classList.add('open');
  }

  // ==================== ANIMAL PORTRAITS (JUNGLE) ====================
  function drawAnimalFace(c2d, rank, cx, cy, r) {
    c2d.save(); c2d.translate(cx, cy); c2d.lineJoin = 'round'; c2d.lineCap = 'round';
    if (rank === 8) {
      c2d.fillStyle = '#94a3b8'; c2d.strokeStyle = '#475569'; c2d.lineWidth = Math.max(1.2, r * 0.08);
      c2d.beginPath(); c2d.ellipse(-r*0.62,-r*0.05,r*0.38,r*0.52,-0.25,0,Math.PI*2); c2d.ellipse(r*0.62,-r*0.05,r*0.38,r*0.52,0.25,0,Math.PI*2); c2d.fill(); c2d.stroke();
      c2d.fillStyle = '#f9a8d4'; c2d.beginPath(); c2d.ellipse(-r*0.62,0,r*0.2,r*0.3,-0.2,0,Math.PI*2); c2d.ellipse(r*0.62,0,r*0.2,r*0.3,0.2,0,Math.PI*2); c2d.fill();

  function drawJungleBoard(st, now) {

        g.addColorStop(0, '#38bdf8'); g.addColorStop(0.55, '#0ea5e9'); g.addColorStop(1, '#0284c7');

        const wy1 = y + cellSize * 0.32 + Math.sin(ph) * 2.4, wy2 = y + cellSize * 0.68 + Math.cos(ph * 0.85) * 2.4;

      } else {

      }
      if (jIsTrap(c, r, 'blue') || jIsTrap(c, r, 'red')) {
        const isB = jIsTrap(c, r, 'blue');
        ctx.save(); ctx.fillStyle = isB ? 'rgba(59,130,246,0.16)' : 'rgba(239,68,68,0.16)'; ctx.fillRect(x+2,y+2,cellSize-4,cellSize-4);

  // BEAUTIFIED XIANGQI BOARD WITH FLOWING ANIMATED CHU-HE HAN-JIE RIVER!
  function drawXiangqiBoard(st, now) {
    const w = boardPad * 2 + 8 * cellSize, h = boardPad * 2 + 9 * cellSize;
    // Rich warm rosewood planks with subtle grain
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#f6dfa9'); bg.addColorStop(0.5, '#e8c174'); bg.addColorStop(1, '#d39f4e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    // Subtle horizontal wood grain streaks
    ctx.save(); ctx.strokeStyle = 'rgba(120, 62, 18, 0.06)'; ctx.lineWidth = 2;
    for (let y = 8; y < h; y += 14) {
      ctx.beginPath(); ctx.moveTo(0, y); ctx.bezierCurveTo(w * 0.3, y + 3, w * 0.7, y - 3, w, y); ctx.stroke();
    }
    ctx.restore();

    // Ornate double outer border
    ctx.strokeStyle = '#5c310e'; ctx.lineWidth = 3;
    ctx.strokeRect(boardPad - 6, boardPad - 6, 8 * cellSize + 12, 9 * cellSize + 12);
    ctx.strokeStyle = '#8b4e1e'; ctx.lineWidth = 1.2;
    ctx.strokeRect(boardPad - 2, boardPad - 2, 8 * cellSize + 4, 9 * cellSize + 4);

    // Grid lines
    ctx.strokeStyle = '#5c310e'; ctx.lineWidth = 1.35;
    for (let r = 0; r < 10; r++) {
      ctx.beginPath(); ctx.moveTo(boardPad, boardPad + r * cellSize); ctx.lineTo(boardPad + 8 * cellSize, boardPad + r * cellSize); ctx.stroke();
    }
    for (let c = 0; c < 9; c++) {
      const x = boardPad + c * cellSize;
      if (c === 0 || c === 8) {
        ctx.beginPath(); ctx.moveTo(x, boardPad); ctx.lineTo(x, boardPad + 9 * cellSize); ctx.stroke();
      } else {
        ctx.beginPath(); ctx.moveTo(x, boardPad); ctx.lineTo(x, boardPad + 4 * cellSize); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(x, boardPad + 5 * cellSize); ctx.lineTo(x, boardPad + 9 * cellSize); ctx.stroke();
      }
    }

    // Star-point crosshair markers (炮 & 兵/卒 positions)
    const markers = [[1,2],[7,2],[1,7],[7,7],[0,3],[2,3],[4,3],[6,3],[8,3],[0,6],[2,6],[4,6],[6,6],[8,6]];
    ctx.save(); ctx.strokeStyle = '#6b3a12'; ctx.lineWidth = 1.3;
    const g = 3.5, l = Math.max(5, cellSize * 0.14);
    markers.forEach(([mc, mr]) => {
      const mx = boardPad + mc * cellSize, my = boardPad + mr * cellSize;
      const drawCorner = (sx, sy) => {
        ctx.beginPath(); ctx.moveTo(mx + sx * g, my + sy * (g + l)); ctx.lineTo(mx + sx * g, my + sy * g); ctx.lineTo(mx + sx * (g + l), my + sy * g); ctx.stroke();
      };
      if (mc > 0) { drawCorner(-1, -1); drawCorner(-1, 1); }
      if (mc < 8) { drawCorner(1, -1); drawCorner(1, 1); }
    });
    ctx.restore();

    // Palace diagonals
    ctx.strokeStyle = '#6b3a12'; ctx.lineWidth = 1.35;
    ctx.beginPath();
    ctx.moveTo(boardPad + 3 * cellSize, boardPad); ctx.lineTo(boardPad + 5 * cellSize, boardPad + 2 * cellSize);
    ctx.moveTo(boardPad + 5 * cellSize, boardPad); ctx.lineTo(boardPad + 3 * cellSize, boardPad + 2 * cellSize);
    ctx.moveTo(boardPad + 3 * cellSize, boardPad + 7 * cellSize); ctx.lineTo(boardPad + 5 * cellSize, boardPad + 9 * cellSize);
    ctx.moveTo(boardPad + 5 * cellSize, boardPad + 7 * cellSize); ctx.lineTo(boardPad + 3 * cellSize, boardPad + 9 * cellSize);
    ctx.stroke();

    // === ANIMATED FLOWING RIVER (楚河 漢界) ===
    const rx = boardPad + 1, ry = boardPad + 4 * cellSize + 1, rw = 8 * cellSize - 2, rh = cellSize - 2;
    ctx.save();
    ctx.beginPath(); ctx.rect(rx, ry, rw, rh); ctx.clip();

    // Lush jade-turquoise river gradient
    const rg = ctx.createLinearGradient(rx, ry, rx, ry + rh);
    rg.addColorStop(0, '#0e7490');
    rg.addColorStop(0.25, '#0891b2');
    rg.addColorStop(0.5, '#22d3ee');
    rg.addColorStop(0.75, '#0891b2');
    rg.addColorStop(1, '#155e75');
    ctx.fillStyle = rg;
    ctx.fillRect(rx, ry, rw, rh);

    // Continuously flowing sine wave ribbons
    const flowT = animationsEnabled ? now * 0.0018 : 0;
    for (let layer = 0; layer < 3; layer++) {
      ctx.beginPath();
      const baseY = ry + rh * (0.24 + layer * 0.26);
      const amp = 2.6 + layer * 0.9;
      const freq = 0.035 + layer * 0.012;
      const speed = (layer % 2 === 0 ? 1 : -0.75) * (1.8 + layer * 0.5);
      for (let px = 0; px <= rw; px += 5) {
        const py = baseY + Math.sin(px * freq - flowT * speed + layer * 2.1) * amp;
        if (px === 0) ctx.moveTo(rx + px, py); else ctx.lineTo(rx + px, py);
      }
      ctx.strokeStyle = layer === 1 ? 'rgba(255, 255, 255, 0.48)' : 'rgba(186, 230, 253, 0.34)';
      ctx.lineWidth = layer === 1 ? 2.2 : 1.5;
      ctx.stroke();
    }

    // Drifting water sparkles
    if (animationsEnabled) {
      for (let i = 0; i < 10; i++) {
        const sx = rx + ((i * 73 + now * (0.025 + (i % 3) * 0.008)) % rw);
        const sy = ry + rh * (0.18 + ((i * 37) % 64) / 100);
        const sa = 0.3 + 0.5 * Math.sin(now * 0.004 + i);
        ctx.fillStyle = `rgba(255, 251, 235, ${sa})`;
        ctx.beginPath(); ctx.ellipse(sx, sy, 4.5, 1.5, 0, 0, Math.PI * 2); ctx.fill();
      }
    }

    // River banks soft shadow
    ctx.strokeStyle = 'rgba(69, 26, 3, 0.45)'; ctx.lineWidth = 2.5;
    ctx.strokeRect(rx, ry, rw, rh);

    // Calligraphic 楚河 · 漢界 floating cleanly with subtle water-halo glow
    ctx.font = `900 ${Math.max(15, Math.floor(cellSize * 0.48))}px ${FONT_STACK}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.lineWidth = 3.5; ctx.strokeStyle = 'rgba(12, 74, 110, 0.72)'; ctx.fillStyle = '#fef9c3';
    ctx.strokeText('楚  河', boardPad + 2 * cellSize, ry + rh / 2);
    ctx.fillText('楚  河', boardPad + 2 * cellSize, ry + rh / 2);
    ctx.save();
    ctx.translate(boardPad + 6 * cellSize, ry + rh / 2); ctx.rotate(Math.PI);
    ctx.strokeText('漢  界', 0, 0); ctx.fillText('漢  界', 0, 0);
    ctx.restore();
    ctx.restore();

    if (st.lastMove) {
      [cellCenter(st.lastMove.fromC, st.lastMove.fromR), cellCenter(st.lastMove.toC, st.lastMove.toR)].forEach((pt, idx) => {
        ctx.save(); ctx.strokeStyle = idx === 0 ? 'rgba(217,119,6,0.72)' : '#f59e0b'; ctx.lineWidth = 2.6;
        ctx.beginPath(); ctx.arc(pt.x, pt.y, cellSize * 0.46, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
      });
    }

    drawValidMoveHints(st, now);

    for (const p of st.pieces) {
      if (activeAnim && activeAnim.game === 'xiangqi' && activeAnim.pieceId === p.id) continue;
      const pt = cellCenter(p.c, p.r), sel = p.id === st.selectedId;
      drawChineseChessPiece(p.side, p.type, pt.x, pt.y + (sel ? -4 : 0), cellSize * 0.44, 1, sel, p.side === 'black', true, 1);
    }
    if (activeAnim && activeAnim.game === 'xiangqi') drawAnimatedPiece(st, now);
  }

  function drawBanqiBoard(st, now) {
    const w = boardPad * 2 + 4 * cellSize, h = boardPad * 2 + 8 * cellSize;
    ctx.fillStyle = '#194d31'; ctx.fillRect(0, 0, w, h);
    for (let r = 0; r < 8; r++) for (let c = 0; c < 4; c++) {
      const x = boardPad + c * cellSize, y = boardPad + r * cellSize;
      ctx.fillStyle = (c + r) % 2 === 0 ? '#246b44' : '#1e5c3a'; ctx.fillRect(x, y, cellSize, cellSize);
      ctx.strokeStyle = 'rgba(254, 243, 199, 0.25)'; ctx.lineWidth = 1.2; ctx.strokeRect(x, y, cellSize, cellSize);
    }
    ctx.save(); ctx.strokeStyle = 'rgba(251, 191, 36, 0.65)'; ctx.lineWidth = 2.4; ctx.setLineDash([6, 4]);
    ctx.beginPath(); ctx.moveTo(boardPad, boardPad + 4 * cellSize); ctx.lineTo(boardPad + 4 * cellSize, boardPad + 4 * cellSize); ctx.stroke(); ctx.restore();
    if (st.lastMove) {
      ctx.fillStyle = 'rgba(250,204,21,0.24)'; ctx.fillRect(boardPad+st.lastMove.fromC*cellSize+1, boardPad+st.lastMove.fromR*cellSize+1, cellSize-2, cellSize-2);
      ctx.fillStyle = 'rgba(250,204,21,0.36)'; ctx.fillRect(boardPad+st.lastMove.toC*cellSize+1, boardPad+st.lastMove.toR*cellSize+1, cellSize-2, cellSize-2);
    }
    drawValidMoveHints(st, now);
    for (const p of st.pieces) {
      if (activeAnim && activeAnim.game === 'banqi' && activeAnim.pieceId === p.id) continue;
      const pt = cellCenter(p.c, p.r), sel = p.id === st.selectedId, rot180 = Boolean(st.p2Color && p.side === st.p2Color);
      drawChineseChessPiece(p.side, p.type, pt.x, pt.y + (sel ? -4 : 0), cellSize * 0.42, 1, sel, rot180, p.faceUp, 1);
