  function drawChineseChessPiece(side, type, x, y, rad, scale, isSelected, rotate180, faceUp, flipScaleX) {
    const r = rad * scale;
    ctx.save(); ctx.translate(x, y); ctx.scale(flipScaleX, 1);
    ctx.fillStyle = isSelected ? 'rgba(0,0,0,0.46)' : 'rgba(0,0,0,0.32)'; ctx.beginPath(); ctx.arc(0, r * 0.15, r, 0, Math.PI * 2); ctx.fill();
    if (isSelected) { ctx.strokeStyle = '#fde047'; ctx.lineWidth = Math.max(3, r * 0.16); ctx.beginPath(); ctx.arc(0,0,r+3,0,Math.PI*2); ctx.stroke(); }
    if (!faceUp) {
      const bg = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1,0,0,r);
      bg.addColorStop(0,'#b45309'); bg.addColorStop(0.7,'#78350f'); bg.addColorStop(1,'#451a03');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#fcd34d'; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(0,0,r*0.78,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle = 'rgba(254,243,199,0.88)'; ctx.font = `900 ${Math.max(12,Math.floor(r*0.82))}px ${FONT_STACK}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('棋',0,1);
      ctx.restore(); return;
    }
    const isRed = side === 'red';
    const rim = ctx.createRadialGradient(-r*0.32,-r*0.32,r*0.1,0,0,r);
    rim.addColorStop(0,'#fffdf5'); rim.addColorStop(0.72,'#f6dfb4'); rim.addColorStop(1,'#a87938');
    ctx.fillStyle = rim; ctx.beginPath(); ctx.arc(0,0,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = isRed ? '#b91c1c' : '#1e293b'; ctx.lineWidth = Math.max(1.8, r * 0.085);
    ctx.beginPath(); ctx.arc(0,0,r*0.82,0,Math.PI*2); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.arc(0,0,r*0.9,Math.PI*1.1,Math.PI*1.85); ctx.stroke();
    ctx.save(); if (rotate180) ctx.rotate(Math.PI);
    ctx.fillStyle = isRed ? '#b91c1c' : '#0f172a'; ctx.font = `900 ${Math.max(14,Math.floor(r*1.08))}px ${FONT_STACK}`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(X_LABELS[side][type], 0, 1);
    ctx.restore(); ctx.restore();
  }

  // 4. BEAUTIFIED INTERNATIONAL CHESS BOARD (3D SCULPTED STAUNTON + 2D FLAT VECTOR)
  function drawStauntonPath(c2d, type, s) {
    // Normalized Staunton silhouette centered around (0, 0), height ~ 2*s (-1.05s top to +0.95s base)
    c2d.beginPath();
    if (type === 'P') {
      // Pawn: spherical head + collar + tapered stem + wide pedestal base
      c2d.arc(0, -0.52 * s, 0.28 * s, 0, Math.PI * 2);
      c2d.moveTo(-0.34 * s, -0.22 * s); c2d.lineTo(0.34 * s, -0.22 * s);
      c2d.quadraticCurveTo(0.2 * s, 0.16 * s, 0.42 * s, 0.56 * s);
      c2d.lineTo(0.56 * s, 0.72 * s); c2d.lineTo(0.56 * s, 0.88 * s);
      c2d.lineTo(-0.56 * s, 0.88 * s); c2d.lineTo(-0.56 * s, 0.72 * s);
      c2d.lineTo(-0.42 * s, 0.56 * s);
      c2d.quadraticCurveTo(-0.2 * s, 0.16 * s, -0.34 * s, -0.22 * s);
      c2d.closePath();
    } else if (type === 'R') {
      // Rook: crenellated castle battlements + tapered tower + wide base
      c2d.moveTo(-0.48 * s, -0.82 * s); c2d.lineTo(-0.28 * s, -0.82 * s); c2d.lineTo(-0.28 * s, -0.64 * s);
      c2d.lineTo(-0.12 * s, -0.64 * s); c2d.lineTo(-0.12 * s, -0.82 * s); c2d.lineTo(0.12 * s, -0.82 * s);
      c2d.lineTo(0.12 * s, -0.64 * s); c2d.lineTo(0.28 * s, -0.64 * s); c2d.lineTo(0.28 * s, -0.82 * s);
      c2d.lineTo(0.48 * s, -0.82 * s); c2d.lineTo(0.48 * s, -0.44 * s);
      c2d.lineTo(0.34 * s, -0.32 * s); c2d.lineTo(0.42 * s, 0.54 * s);
      c2d.lineTo(0.6 * s, 0.72 * s); c2d.lineTo(0.6 * s, 0.88 * s);
      c2d.lineTo(-0.6 * s, 0.88 * s); c2d.lineTo(-0.6 * s, 0.72 * s);
      c2d.lineTo(-0.42 * s, 0.54 * s); c2d.lineTo(-0.34 * s, -0.32 * s);
      c2d.lineTo(-0.48 * s, -0.44 * s); c2d.closePath();
    } else if (type === 'N') {
      // Knight: sculpted horse head, arched mane, pointed ear, snout & pedestal
      c2d.moveTo(-0.56 * s, 0.88 * s); c2d.lineTo(-0.56 * s, 0.7 * s);
      c2d.lineTo(-0.4 * s, 0.54 * s);
      c2d.quadraticCurveTo(-0.46 * s, 0.05 * s, -0.22 * s, -0.28 * s);
      c2d.lineTo(-0.48 * s, -0.1 * s); c2d.quadraticCurveTo(-0.6 * s, -0.18 * s, -0.52 * s, -0.34 * s);
      c2d.lineTo(-0.18 * s, -0.68 * s); c2d.lineTo(-0.14 * s, -0.92 * s); c2d.lineTo(0.05 * s, -0.74 * s);
      c2d.quadraticCurveTo(0.46 * s, -0.64 * s, 0.48 * s, -0.12 * s);
      c2d.quadraticCurveTo(0.5 * s, 0.3 * s, 0.44 * s, 0.54 * s);
      c2d.lineTo(0.58 * s, 0.7 * s); c2d.lineTo(0.58 * s, 0.88 * s); c2d.closePath();
    } else if (type === 'B') {
      // Bishop: mitre dome + finial tip + collar + slender waist + base
      c2d.arc(0, -0.88 * s, 0.11 * s, 0, Math.PI * 2);
      c2d.moveTo(0, -0.78 * s);
      c2d.bezierCurveTo(0.42 * s, -0.54 * s, 0.44 * s, -0.12 * s, 0.26 * s, 0.04 * s);
      c2d.lineTo(0.38 * s, 0.16 * s); c2d.lineTo(0.28 * s, 0.24 * s);
      c2d.lineTo(0.42 * s, 0.56 * s); c2d.lineTo(0.58 * s, 0.72 * s); c2d.lineTo(0.58 * s, 0.88 * s);
      c2d.lineTo(-0.58 * s, 0.88 * s); c2d.lineTo(-0.58 * s, 0.72 * s); c2d.lineTo(-0.42 * s, 0.56 * s);
      c2d.lineTo(-0.28 * s, 0.24 * s); c2d.lineTo(-0.38 * s, 0.16 * s); c2d.lineTo(-0.26 * s, 0.04 * s);
      c2d.bezierCurveTo(-0.44 * s, -0.12 * s, -0.42 * s, -0.54 * s, 0, -0.78 * s);
      c2d.closePath();
    } else if (type === 'Q') {
      // Queen: 5-point royal crown + pearls + elegant flared body + base
      c2d.moveTo(-0.62 * s, 0.88 * s); c2d.lineTo(-0.62 * s, 0.7 * s); c2d.lineTo(-0.44 * s, 0.54 * s);
      c2d.lineTo(-0.36 * s, 0.1 * s); c2d.lineTo(-0.58 * s, -0.52 * s);
      c2d.lineTo(-0.26 * s, -0.26 * s); c2d.lineTo(-0.24 * s, -0.72 * s);
      c2d.lineTo(0, -0.34 * s); c2d.lineTo(0, -0.82 * s); c2d.lineTo(0.06 * s, -0.34 * s);
      c2d.lineTo(0.24 * s, -0.72 * s); c2d.lineTo(0.26 * s, -0.26 * s);
      c2d.lineTo(0.58 * s, -0.52 * s); c2d.lineTo(0.36 * s, 0.1 * s);
      c2d.lineTo(0.44 * s, 0.54 * s); c2d.lineTo(0.62 * s, 0.7 * s); c2d.lineTo(0.62 * s, 0.88 * s);
      c2d.closePath();
    } else {
      // King: royal cross on top + crown dome + collar + broad regal base
      c2d.moveTo(-0.08 * s, -1.04 * s); c2d.lineTo(0.08 * s, -1.04 * s); c2d.lineTo(0.08 * s, -0.88 * s);
      c2d.lineTo(0.24 * s, -0.88 * s); c2d.lineTo(0.24 * s, -0.74 * s); c2d.lineTo(0.08 * s, -0.74 * s);
      c2d.lineTo(0.08 * s, -0.62 * s);
      c2d.bezierCurveTo(0.56 * s, -0.58 * s, 0.58 * s, -0.12 * s, 0.36 * s, 0.14 * s);
      c2d.lineTo(0.44 * s, 0.56 * s); c2d.lineTo(0.62 * s, 0.72 * s); c2d.lineTo(0.62 * s, 0.88 * s);
      c2d.lineTo(-0.62 * s, 0.88 * s); c2d.lineTo(-0.62 * s, 0.72 * s); c2d.lineTo(-0.44 * s, 0.56 * s);
      c2d.lineTo(-0.36 * s, 0.14 * s);
      c2d.bezierCurveTo(-0.58 * s, -0.12 * s, -0.56 * s, -0.58 * s, -0.08 * s, -0.62 * s);
      c2d.lineTo(-0.08 * s, -0.74 * s); c2d.lineTo(-0.24 * s, -0.74 * s); c2d.lineTo(-0.24 * s, -0.88 * s);
      c2d.lineTo(-0.08 * s, -0.88 * s); c2d.closePath();
    }
  }

  function getChessMiniIcon(side, type) {
    const k = `ch_${side}_${type}`;
    if (iconCache[k]) return iconCache[k];
    const off = document.createElement('canvas'); off.width = 56; off.height = 56;
    const oc = off.getContext('2d');
    const isW = side === 'white';
    oc.translate(28, 29);
    drawStauntonPath(oc, type, 23);
    oc.fillStyle = isW ? '#fffbeb' : '#1e293b';
    oc.strokeStyle = isW ? '#78350f' : '#cbd5e1';
    oc.lineWidth = 2.2;
    oc.fill(); oc.stroke();
    return (iconCache[k] = off.toDataURL('image/png'));
  }

  function drawChessBoard(st, now) {
    const w = boardPad * 2 + 8 * cellSize, h = boardPad * 2 + 8 * cellSize;
    // Deep walnut board frame
    const fg = ctx.createLinearGradient(0, 0, w, h);
    fg.addColorStop(0, '#5c3416'); fg.addColorStop(1, '#3b1f0b');
    ctx.fillStyle = fg; ctx.fillRect(0, 0, w, h);

    // Inner gold trim
    ctx.strokeStyle = 'rgba(251, 191, 36, 0.45)'; ctx.lineWidth = 1.6;
    ctx.strokeRect(boardPad - 2, boardPad - 2, 8 * cellSize + 4, 8 * cellSize + 4);

    // Walnut & Honey-Maple Squares
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const x = boardPad + c * cellSize, y = boardPad + r * cellSize;
      const isLight = (c + r) % 2 === 0;
      const sg = ctx.createLinearGradient(x, y, x + cellSize, y + cellSize);
      if (isLight) { sg.addColorStop(0, '#f5e2be'); sg.addColorStop(1, '#e8cb99'); }
      else { sg.addColorStop(0, '#a66e43'); sg.addColorStop(1, '#8c5630'); }
      ctx.fillStyle = sg;
      ctx.fillRect(x, y, cellSize, cellSize);
    }

    // Subtle algebraic coordinates (a-h, 1-8)
    ctx.save();
    ctx.font = `800 ${Math.max(8, Math.floor(cellSize * 0.17))}px ${FONT_STACK}`;
    for (let i = 0; i < 8; i++) {
      ctx.fillStyle = i % 2 === 0 ? '#784421' : '#f5e2be';
      ctx.textAlign = 'left'; ctx.textBaseline = 'top';
      ctx.fillText(String(8 - i), boardPad + 3, boardPad + i * cellSize + 2);
      ctx.fillStyle = i % 2 === 1 ? '#784421' : '#f5e2be';
      ctx.textAlign = 'right'; ctx.textBaseline = 'bottom';
      ctx.fillText('abcdefgh'[i], boardPad + (i + 1) * cellSize - 3, boardPad + 8 * cellSize - 2);
    }
    ctx.restore();

    // Last move warm highlight
    if (st.lastMove) {
      ctx.fillStyle = 'rgba(250, 204, 21, 0.34)';
      ctx.fillRect(boardPad + st.lastMove.fromC * cellSize, boardPad + st.lastMove.fromR * cellSize, cellSize, cellSize);
      ctx.fillStyle = 'rgba(250, 204, 21, 0.5)';
      ctx.fillRect(boardPad + st.lastMove.toC * cellSize, boardPad + st.lastMove.toR * cellSize, cellSize, cellSize);
    }

    // Check pulsing halo under King
    if (!st.gameOver && cIsInCheck(st.turn, st.pieces)) {
      const king = st.pieces.find(p => p.side === st.turn && p.type === 'K');
      if (king) {
        const kp = cellCenter(king.c, king.r);
        const cg = ctx.createRadialGradient(kp.x, kp.y, cellSize * 0.1, kp.x, kp.y, cellSize * 0.52);
        cg.addColorStop(0, 'rgba(239, 68, 68, 0.78)'); cg.addColorStop(1, 'rgba(239, 68, 68, 0)');
        ctx.fillStyle = cg; ctx.beginPath(); ctx.arc(kp.x, kp.y, cellSize * 0.52, 0, Math.PI * 2); ctx.fill();
      }
    }

    drawValidMoveHints(st, now);

    for (const p of st.pieces) {
      if (activeAnim && activeAnim.game === 'chess' && activeAnim.pieceId === p.id) continue;
      const pt = cellCenter(p.c, p.r), sel = p.id === st.selectedId;
      drawChessPiece(p, pt.x, pt.y + (sel ? -5 : 0), 1, sel);
    }
    if (activeAnim && activeAnim.game === 'chess') drawAnimatedPiece(st, now);
  }

  function drawChessPiece(piece, x, y, scale, isSelected) {
    const isW = piece.side === 'white';
    ctx.save();
    ctx.translate(x, y);

    if (chessPieceStyle === 'flat') {
      // === CLEAN 2D FLAT TOURNAMENT TOKEN ===
      const r = cellSize * 0.42 * scale;
      ctx.fillStyle = isSelected ? 'rgba(0,0,0,0.44)' : 'rgba(0,0,0,0.28)';
      ctx.beginPath(); ctx.arc(0, r * 0.12, r, 0, Math.PI * 2); ctx.fill();
      if (isSelected) {
        ctx.strokeStyle = '#fde047'; ctx.lineWidth = Math.max(3, r * 0.15);
        ctx.beginPath(); ctx.arc(0, 0, r + 3, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.fillStyle = isW ? '#fffdf5' : '#1e293b';
      ctx.strokeStyle = isW ? '#b45309' : '#94a3b8';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

      ctx.save();
      if (!isW) ctx.rotate(Math.PI);
      const s = r * 0.72;
      drawStauntonPath(ctx, piece.type, s);
      ctx.fillStyle = isW ? '#78350f' : '#f8fafc';
      ctx.fill();
      ctx.restore();
      ctx.restore();
      return;
    }

    // === SCULPTED 3D STAUNTON CHESS PIECE ===
    const s = cellSize * 0.43 * scale;
    if (!isW) ctx.rotate(Math.PI);

    // 1. Cast elliptical ground shadow under pedestal
    ctx.fillStyle = isSelected ? 'rgba(0,0,0,0.48)' : 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(s * 0.08, s * 0.86, s * 0.68, s * 0.24, 0, 0, Math.PI * 2);
    ctx.fill();

    // 2. Selection golden spotlight ring
    if (isSelected) {
      ctx.strokeStyle = '#fde047';
      ctx.lineWidth = Math.max(2.6, s * 0.12);
      ctx.beginPath();
      ctx.ellipse(0, s * 0.82, s * 0.76, s * 0.28, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 3. 3D Cylindrical lighting gradient across Staunton silhouette
    const bodyGrad = ctx.createLinearGradient(-s * 0.6, -s * 0.4, s * 0.65, s * 0.6);
    if (isW) {
      bodyGrad.addColorStop(0, '#ffffff');
      bodyGrad.addColorStop(0.35, '#fef6e0');
      bodyGrad.addColorStop(0.75, '#e7cca0');
      bodyGrad.addColorStop(1, '#b8915c');
    } else {
      bodyGrad.addColorStop(0, '#64748b');
      bodyGrad.addColorStop(0.32, '#334155');
      bodyGrad.addColorStop(0.72, '#0f172a');
      bodyGrad.addColorStop(1, '#020617');
    }

    drawStauntonPath(ctx, piece.type, s);
    ctx.fillStyle = bodyGrad;
    ctx.fill();
    ctx.strokeStyle = isW ? '#78481d' : '#94a3b8';
    ctx.lineWidth = Math.max(1.3, s * 0.075);
    ctx.lineJoin = 'round';
    ctx.stroke();

    // 4. Sculpted 3D collar & pedestal rim highlights
    ctx.strokeStyle = isW ? 'rgba(139, 86, 36, 0.55)' : 'rgba(226, 232, 240, 0.45)';
    ctx.lineWidth = Math.max(1.1, s * 0.06);
    ctx.beginPath();
    ctx.moveTo(-0.46 * s, 0.68 * s); ctx.quadraticCurveTo(0, 0.78 * s, 0.46 * s, 0.68 * s);
    ctx.moveTo(-0.34 * s, 0.52 * s); ctx.quadraticCurveTo(0, 0.6 * s, 0.34 * s, 0.52 * s);
    ctx.stroke();

    // Piece-specific sculpted details (Bishop mitre slit, Knight eye, Queen crown pearls)
    if (piece.type === 'B') {
      ctx.strokeStyle = isW ? '#78481d' : '#cbd5e1';
      ctx.lineWidth = Math.max(1.3, s * 0.075);
      ctx.beginPath(); ctx.moveTo(-0.14 * s, -0.42 * s); ctx.lineTo(0.18 * s, -0.18 * s); ctx.stroke();
    } else if (piece.type === 'N') {
      ctx.fillStyle = isW ? '#78481d' : '#e2e8f0';
      ctx.beginPath(); ctx.arc(-0.14 * s, -0.48 * s, Math.max(1.6, s * 0.075), 0, Math.PI * 2); ctx.fill();
    } else if (piece.type === 'Q') {
      ctx.fillStyle = isW ? '#f59e0b' : '#fde047';
      [[-0.58,-0.54],[-0.24,-0.74],[0,-0.84],[0.24,-0.74],[0.58,-0.54]].forEach(([px, py]) => {
        ctx.beginPath(); ctx.arc(px * s, py * s, Math.max(1.8, s * 0.085), 0, Math.PI * 2); ctx.fill();
      });
    }

    ctx.restore();
  }

  // 5. BEAUTIFIED GO (WEIQI) BOARD — GOLDEN KAYA WOOD + GLOSSY STONES
  function drawGoBoard(st, now) {
    const n = st.size, span = (n - 1) * cellSize;
    const w = boardPad * 2 + span, h = boardPad * 2 + span;

    // Luminous Kaya-wood (榧木) gradient
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#f3d18d'); bg.addColorStop(0.5, '#e5b968'); bg.addColorStop(1, '#d39f49');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    // Subtle vertical wood grain lines
    ctx.save(); ctx.strokeStyle = 'rgba(120, 62, 18, 0.075)'; ctx.lineWidth = 1.8;
    for (let x = 10; x < w; x += 13) {
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.bezierCurveTo(x + 2.5, h * 0.35, x - 2.5, h * 0.7, x, h); ctx.stroke();
    }
    ctx.restore();

    // Grid lines
    ctx.strokeStyle = '#3b240b'; ctx.lineWidth = n >= 19 ? 1.0 : 1.35;
    for (let i = 0; i < n; i++) {
      const p = boardPad + i * cellSize;
      ctx.beginPath(); ctx.moveTo(boardPad, p); ctx.lineTo(boardPad + span, p); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(p, boardPad); ctx.lineTo(p, boardPad + span); ctx.stroke();
    }
    ctx.lineWidth = 2.2; ctx.strokeRect(boardPad, boardPad, span, span);

    // Star points (星位)
    const stars = n === 9 ? [[2,2],[6,2],[4,4],[2,6],[6,6]]
      : (n === 13 ? [[3,3],[9,3],[6,6],[3,9],[9,9]] : [[3,3],[9,3],[15,3],[3,9],[9,9],[15,9],[3,15],[9,15],[15,15]]);
    ctx.fillStyle = '#2c1805';
    const sr = Math.max(2.6, cellSize * 0.095);
    stars.forEach(([sc, srw]) => {
      ctx.beginPath(); ctx.arc(boardPad + sc * cellSize, boardPad + srw * cellSize, sr, 0, Math.PI * 2); ctx.fill();
    });

    // Stones
    const rad = cellSize * 0.45;
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) {
      const col = st.board[r][c];
      if (!col) continue;
      const x = boardPad + c * cellSize, y = boardPad + r * cellSize;
      ctx.save();
      ctx.fillStyle = 'rgba(0,0,0,0.34)'; ctx.beginPath(); ctx.arc(x + 1.5, y + 2.2, rad, 0, Math.PI * 2); ctx.fill();
      const sg = ctx.createRadialGradient(x - rad * 0.32, y - rad * 0.32, rad * 0.08, x, y, rad);
      if (col === 'black') { sg.addColorStop(0, '#64748b'); sg.addColorStop(0.35, '#1e293b'); sg.addColorStop(1, '#020617'); }
      else { sg.addColorStop(0, '#ffffff'); sg.addColorStop(0.7, '#f1f5f9'); sg.addColorStop(1, '#cbd5e1'); }
      ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(x, y, rad, 0, Math.PI * 2); ctx.fill();
      if (col === 'white') { ctx.strokeStyle = 'rgba(100,116,139,0.45)'; ctx.lineWidth = 0.8; ctx.stroke(); }

      // Last move ring
      if (st.lastMove && st.lastMove.toC === c && st.lastMove.toR === r) {
        ctx.strokeStyle = col === 'black' ? '#fde047' : '#dc2626';
        ctx.lineWidth = Math.max(1.8, rad * 0.14);
        ctx.beginPath(); ctx.arc(x, y, rad * 0.42, 0, Math.PI * 2); ctx.stroke();
      }
      ctx.restore();
    }
  }

  // 6. OTHELLO (REVERSI 8×8) BOARD WITH 3D CASCADING FLIPS
  function drawOthelloBoard(st, now) {
    const w = boardPad * 2 + 8 * cellSize, h = boardPad * 2 + 8 * cellSize;
    const bg = ctx.createLinearGradient(0, 0, w, h);
    bg.addColorStop(0, '#0f6b43'); bg.addColorStop(1, '#084c2e');
    ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h);

    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const x = boardPad + c * cellSize, y = boardPad + r * cellSize;
      ctx.fillStyle = (c + r) % 2 === 0 ? 'rgba(255,255,255,0.04)' : 'rgba(0,0,0,0.05)';
      ctx.fillRect(x, y, cellSize, cellSize);
      ctx.strokeStyle = 'rgba(254, 243, 199, 0.28)'; ctx.lineWidth = 1.2; ctx.strokeRect(x, y, cellSize, cellSize);
    }

    // Legal move hints
    if (!st.gameOver) {
      const legal = oGetAllValidMoves(st.board, st.turn);
      const pulse = animationsEnabled ? (0.4 + 0.4 * Math.sin(now * 0.008)) : 0.7;
      legal.forEach(m => {
        const pt = cellCenter(m.c, m.r);
        ctx.save();
        ctx.strokeStyle = st.turn === 'black' ? `rgba(15, 23, 42, ${pulse + 0.2})` : `rgba(255, 255, 255, ${pulse + 0.2})`;
        ctx.fillStyle = st.turn === 'black' ? `rgba(15, 23, 42, ${pulse * 0.45})` : `rgba(255, 255, 255, ${pulse * 0.45})`;
        ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(pt.x, pt.y, cellSize * 0.16, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
        ctx.restore();
      });
    }

    // Discs (with cascading 3D flip animation)
    const rad = cellSize * 0.4;
    for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
      const col = st.board[r][c];
      if (!col) continue;
      const pt = cellCenter(c, r);
      const anim = flipAnims.find(a => a.c === c && a.r === r);
      let drawCol = col, sx = 1, lift = 0;
      if (anim) {
        const el = now - anim.startTime;
        if (el < 0) drawCol = anim.from;
        else {
          const t = Math.min(1, el / anim.duration);
          drawCol = t < 0.5 ? anim.from : anim.to;
          sx = Math.max(0.08, Math.abs(Math.cos(t * Math.PI)));
          lift = Math.sin(t * Math.PI) * 8;
        }
      }
      ctx.save(); ctx.translate(pt.x, pt.y - lift); ctx.scale(sx, 1);
      ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.arc(0, rad * 0.15, rad, 0, Math.PI * 2); ctx.fill();
      const g = ctx.createRadialGradient(-rad*0.3,-rad*0.3,rad*0.1,0,0,rad);
      if (drawCol === 'black') { g.addColorStop(0,'#64748b'); g.addColorStop(0.4,'#1e293b'); g.addColorStop(1,'#020617'); }
      else { g.addColorStop(0,'#ffffff'); g.addColorStop(0.75,'#f1f5f9'); g.addColorStop(1,'#cbd5e1'); }
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0,0,rad,0,Math.PI*2); ctx.fill();
      if (st.lastMove && st.lastMove.toC === c && st.lastMove.toR === r && !anim) {
        ctx.fillStyle = '#f59e0b'; ctx.beginPath(); ctx.arc(0, 0, rad * 0.18, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
    flipAnims = flipAnims.filter(a => now - a.startTime < a.duration);
  }

  function drawValidMoveHints(st, now) {
    const pulse = animationsEnabled ? (0.5 + 0.5 * Math.sin(now * 0.008)) : 0.85;
    for (const m of (st.validMoves || [])) {
      const { x, y } = cellCenter(m.c, m.r);
      ctx.save();
      if (m.capture) {
        ctx.strokeStyle = `rgba(220, 38, 38, ${0.65 + pulse * 0.35})`; ctx.lineWidth = Math.max(3, cellSize * 0.08);
        ctx.beginPath(); ctx.arc(x, y, cellSize * 0.44, 0, Math.PI * 2); ctx.stroke();
      } else if (m.kind === 'jump' && currentGame === 'jungle') {
        ctx.fillStyle = `rgba(245, 158, 11, ${0.38 + pulse * 0.25})`; ctx.beginPath(); ctx.arc(x, y, cellSize * 0.29, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#b45309'; ctx.lineWidth = 2.4; ctx.stroke();
        ctx.fillStyle = '#78350f'; ctx.font = `900 ${Math.max(10, Math.floor(cellSize * 0.23))}px ${FONT_STACK}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('跳', x, y);
      } else {
        ctx.fillStyle = (currentGame === 'jungle' && (m.kind === 'splashIn' || m.kind === 'swim'))
          ? `rgba(255,255,255,${0.58 + pulse * 0.35})` : `rgba(22,163,74,${0.5 + pulse * 0.35})`;
        ctx.beginPath(); ctx.arc(x, y, cellSize * 0.19, 0, Math.PI * 2); ctx.fill();
      }
      ctx.restore();
    }
  }

  function drawAnimatedPiece(st, now) {
    const a = activeAnim, t = Math.min(1, (now - a.startTime) / a.duration);
    const p = st.pieces.find(item => item.id === a.pieceId);
    if (!p) { activeAnim = null; return; }

    if (a.mode === 'flip') {
      const pt = cellCenter(p.c, p.r), sx = Math.max(0.06, Math.abs(Math.cos(t * Math.PI)));
      const rot180 = Boolean(st.p2Color && p.side === st.p2Color);
      drawChineseChessPiece(p.side, p.type, pt.x, pt.y - Math.sin(t * Math.PI) * 10, cellSize * 0.42, 1 + Math.sin(t * Math.PI) * 0.12, false, rot180, t >= 0.5, sx);
      if (t >= 1) { activeAnim = null; finalizeBanqiFlip(st, p); }
      return;
    }

    const start = cellCenter(a.fromC, a.fromR), end = cellCenter(a.toC, a.toR);
    const ease = 1 - Math.pow(1 - t, 3);
    let curX = start.x + (end.x - start.x) * ease, curY = start.y + (end.y - start.y) * ease;
    let arcH = Math.sin(t * Math.PI) * cellSize * 0.16, scale = 1 + Math.sin(t * Math.PI) * 0.06;

    if (a.game === 'jungle') {
      if (a.animStyle === 'elephantStomp') {
        const se = t < 0.7 ? (t / 0.7) * 0.85 : 0.85 + Math.pow((t - 0.7) / 0.3, 2) * 0.15;
        curX = start.x + (end.x - start.x) * se; curY = start.y + (end.y - start.y) * se;
        arcH = t < 0.72 ? Math.sin((t / 0.72) * Math.PI * 0.85) * cellSize * 0.55 : (1 - (t - 0.72) / 0.28) * cellSize * 0.25;
        scale = 1 + (arcH / cellSize) * 0.35;
      } else if (a.animStyle === 'lionJump' || a.animStyle === 'tigerJump') {
        arcH = Math.sin(t * Math.PI) * cellSize * 1.2; scale = 1 + Math.sin(t * Math.PI) * 0.32;
        ctx.save(); ctx.fillStyle = 'rgba(15,23,42,0.28)'; ctx.beginPath(); ctx.ellipse(curX, curY + cellSize * 0.15, cellSize * 0.34 * (1 - Math.sin(t * Math.PI) * 0.25), cellSize * 0.16, 0, 0, Math.PI * 2); ctx.fill(); ctx.restore();
      } else if (a.animStyle === 'lionBound') { arcH = Math.sin(t * Math.PI) * cellSize * 0.52; scale = 1 + Math.sin(t * Math.PI) * 0.18; }
      else if (a.animStyle === 'tigerPounce') { arcH = Math.sin(t * Math.PI) * cellSize * 0.38; scale = 1 + Math.sin(t * Math.PI) * 0.16; }
      else if (a.animStyle === 'leopardDash') {
        for (let g = 1; g <= 3; g++) {
          const gt = Math.max(0, t - g * 0.11), ge = 1 - Math.pow(1 - gt, 3);
          drawJunglePiece(p, start.x + (end.x - start.x) * ge, start.y + (end.y - start.y) * ge, 0.94, 0.38 - g * 0.1, false, false, false);
        }
      } else if (a.animStyle === 'dogBounce') { arcH = Math.abs(Math.sin(t * Math.PI * 2)) * cellSize * 0.36; scale = 1 + Math.abs(Math.sin(t * Math.PI * 2)) * 0.12; }
      else if (a.animStyle === 'ratScurry') {
        const px = -(end.y - start.y), py = end.x - start.x, len = Math.hypot(px, py) || 1, w = Math.sin(t * Math.PI * 4) * cellSize * 0.1;
        curX += (px / len) * w; curY += (py / len) * w; arcH = Math.abs(Math.sin(t * Math.PI * 2)) * 4;
      } else if (a.animStyle === 'splashIn' || a.animStyle === 'splashOut') { arcH = Math.sin(t * Math.PI) * cellSize * 0.48; scale = 1 + Math.sin(t * Math.PI) * 0.15; }
      drawJunglePiece(p, curX, curY - arcH, scale, 1, false, false, false);
    } else if (a.game === 'xiangqi') {
      if (a.move.kind === 'jump') { arcH = Math.sin(t * Math.PI) * cellSize * 0.65; scale = 1 + Math.sin(t * Math.PI) * 0.2; }
      drawChineseChessPiece(p.side, p.type, curX, curY - arcH, cellSize * 0.44, scale, false, p.side === 'black', true, 1);
    } else if (a.game === 'banqi') {
      if (a.move.kind === 'jump') { arcH = Math.sin(t * Math.PI) * cellSize * 0.7; scale = 1 + Math.sin(t * Math.PI) * 0.22; }
      drawChineseChessPiece(p.side, p.type, curX, curY - arcH, cellSize * 0.42, scale, false, Boolean(st.p2Color && p.side === st.p2Color), true, 1);
    } else if (a.game === 'chess') {
      if (a.move.kind === 'jump') { arcH = Math.sin(t * Math.PI) * cellSize * 0.65; scale = 1 + Math.sin(t * Math.PI) * 0.2; }
      drawChessPiece(p, curX, curY - arcH, scale, false);
    }

    if (t >= 1) { activeAnim = null; finalizePieceMove(st, p, a.fromC, a.fromR, a.toC, a.toR, a.move, a.victim); }
  }

  function stepAndDrawEffects() {
    for (let i = ripples.length - 1; i >= 0; i--) {
      const rp = ripples[i]; rp.r += (rp.maxR - rp.r) * 0.14; rp.alpha -= 0.032;
      if (rp.alpha <= 0) { ripples.splice(i, 1); continue; }
      ctx.save(); ctx.strokeStyle = rp.color; ctx.globalAlpha = rp.alpha; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
    }
    for (let i = slashes.length - 1; i >= 0; i--) {
      const sl = slashes[i]; sl.life -= sl.decay;
      if (sl.life <= 0) { slashes.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = sl.life; ctx.strokeStyle = sl.color; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(sl.x1-5,sl.y1-5); ctx.lineTo(sl.x2-5,sl.y2-5); ctx.moveTo(sl.x1+5,sl.y1+5); ctx.lineTo(sl.x2+5,sl.y2+5); ctx.stroke(); ctx.restore();
    }
    for (let i = pawPrints.length - 1; i >= 0; i--) { pawPrints[i].life -= pawPrints[i].decay; if (pawPrints[i].life <= 0) pawPrints.splice(i, 1); }
    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.gravity; pt.life -= pt.decay;
      if (pt.life <= 0) { particles.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0, pt.life); ctx.fillStyle = pt.color; ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI * 2); ctx.fill(); ctx.restore();
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i]; ft.y += ft.vy; ft.life -= ft.decay;
      if (ft.life <= 0) { floatingTexts.splice(i, 1); continue; }
      ctx.save(); ctx.globalAlpha = Math.max(0, ft.life); ctx.font = `900 ${Math.max(15, Math.floor(cellSize * 0.36))}px ${FONT_STACK}`;
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineWidth = 4; ctx.strokeStyle = '#fff'; ctx.strokeText(ft.text, ft.x, ft.y);
      ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x, ft.y); ctx.restore();
    }
  }

  function loop(now) {
    const st = getActiveState();
    const wrapper = document.getElementById('boardWrapper');
    if (animationsEnabled && now < shakeUntil) {
      wrapper.style.transform = `translate(${((Math.random()-0.5)*shakeIntensity*2).toFixed(1)}px, ${((Math.random()-0.5)*shakeIntensity*2).toFixed(1)}px)`;
    } else if (wrapper.style.transform) wrapper.style.transform = '';

    if (currentGame === 'jungle') drawJungleBoard(st, now);
    else if (currentGame === 'xiangqi') drawXiangqiBoard(st, now);
    else if (currentGame === 'banqi') drawBanqiBoard(st, now);
    else if (currentGame === 'chess') drawChessBoard(st, now);
    else if (currentGame === 'go') drawGoBoard(st, now);
    else drawOthelloBoard(st, now);

    stepAndDrawEffects();
    rafId = requestAnimationFrame(loop);
  }

  // ==================== UI SYNCHRONIZATION ====================
  function renderLostTray(trayEl, list, mode) {
    trayEl.innerHTML = '';
    if (mode === 'text') {
      const s = document.createElement('span'); s.className = 'empty-lost'; s.style.color = '#475569'; s.style.fontWeight = '800'; s.textContent = list;
      trayEl.appendChild(s); return;
    }
    if (!list || list.length === 0) {
      const e = document.createElement('span'); e.className = 'empty-lost'; e.textContent = '暫無失去棋子';
      trayEl.appendChild(e); return;
    }
    list.forEach(p => {
      const chip = document.createElement('div');
      const cls = p.side === 'red' ? 'red' : (p.side === 'blue' ? 'blue' : '');
      chip.className = `lost-chip ${cls}`;
      if (currentGame === 'jungle') {
        const img = document.createElement('img'); img.src = getJungleMiniIcon(p.side, p.rank); img.alt = ANIMALS[p.rank].title;
        const lbl = document.createElement('span'); lbl.textContent = `${ANIMALS[p.rank].name}${p.rank}`;
        chip.appendChild(img); chip.appendChild(lbl);
      } else if (currentGame === 'chess') {
        const img = document.createElement('img');
        img.src = getChessMiniIcon(p.side, p.type);
        img.alt = p.type;
        chip.appendChild(img);
      } else {
        chip.textContent = X_LABELS[p.side][p.type];
      }
      trayEl.appendChild(chip);
    });
  }

  function updateUI() {
    const st = getActiveState();

  // ==================== INPUT HANDLING ====================
  function handleBoardTapCoords(clientX, clientY) {
    const st = getActiveState();
    if (st.gameOver || activeAnim) return;
    ensureAudio();

    const rect = canvas.getBoundingClientRect();
    const x = clientX - rect.left, y = clientY - rect.top;
    const { cols, rows, intersect } = getGridDims();
    const c = intersect ? Math.round((x - boardPad) / cellSize) : Math.floor((x - boardPad) / cellSize);
    const r = intersect ? Math.round((y - boardPad) / cellSize) : Math.floor((y - boardPad) / cellSize);
    if (c < 0 || c >= cols || r < 0 || r >= rows) return;

    if (currentGame === 'go') { executeGoMove(c, r); return; }
    if (currentGame === 'othello') { executeOthelloMove(c, r); return; }

    if (st.selectedId !== null) {
      const move = st.validMoves.find(m => m.c === c && m.r === r);
      if (move) {
        const piece = st.pieces.find(p => p.id === st.selectedId);
        if (piece) { executePieceMove(piece, move); return; }
      }
    }

    const clicked = st.pieces.find(p => p.c === c && p.r === r);
    if (currentGame === 'banqi') {
      if (clicked && !clicked.faceUp) { executeBanqiFlip(clicked); return; }
      const myCol = st.turn === 'p1' ? st.p1Color : st.p2Color;
      if (clicked && clicked.faceUp && clicked.side === myCol) {
        if (st.selectedId === clicked.id) { st.selectedId = null; st.validMoves = []; }
        else { st.selectedId = clicked.id; st.validMoves = bGetValidMoves(clicked, st.pieces); playSound('select'); }
        updateUI(); return;
      }
      st.selectedId = null; st.validMoves = []; updateUI(); return;
    }

    if (clicked && clicked.side === st.turn) {
      if (st.selectedId === clicked.id) { st.selectedId = null; st.validMoves = []; }
      else {
        st.selectedId = clicked.id;
        st.validMoves = currentGame === 'jungle' ? jGetValidMoves(clicked, st.pieces)
          : (currentGame === 'xiangqi' ? xGetValidMoves(clicked, st.pieces) : cGetValidMoves(clicked, st.pieces, st.enPassant));
        playSound('select');
      }
      updateUI();
    } else {
      st.selectedId = null; st.validMoves = []; updateUI();
    }
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', (e) => { if (e.isPrimary !== false) handleBoardTapCoords(e.clientX, e.clientY); });
  } else {
    canvas.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); if (e.changedTouches && e.changedTouches[0]) handleBoardTapCoords(e.changedTouches[0].clientX, e.changedTouches[0].clientY); }, { passive: false });
    canvas.addEventListener('mousedown', (e) => handleBoardTapCoords(e.clientX, e.clientY));
  }

  // ==================== RESPONSIVE CANVAS SIZING ====================
  function resizeCanvas() {
    const stage = document.getElementById('boardStage');
    const hint = document.getElementById('statusHint');
    const goBar = document.getElementById('goSubbar');
    const chessBar = document.getElementById('chessSubbar');
    const rect = stage.getBoundingClientRect();

    const stageW = rect.width > 120 ? rect.width : (window.innerWidth - 16);
    const stageH = rect.height > 150 ? rect.height : (window.innerHeight - (boardZoomMode ? 20 : 230));

    const extraH = ((hint && !hint.classList.contains('hidden')) ? (hint.offsetHeight + 6) : 0)
      + ((goBar && goBar.classList.contains('visible')) ? (goBar.offsetHeight + 6) : 0)
      + ((chessBar && chessBar.classList.contains('visible')) ? (chessBar.offsetHeight + 6) : 0);

    const availW = Math.max(200, stageW - (boardZoomMode ? 12 : 18));
    const availH = Math.max(220, stageH - extraH - (boardZoomMode ? 12 : 18));

    const { cols, rows, intersect } = getGridDims();
    const spanCols = intersect ? (cols - 1) : cols;
    const spanRows = intersect ? (rows - 1) : rows;
    boardPad = intersect ? Math.max(16, Math.floor(Math.min(availW, availH) * 0.055)) : 8;

    const sizeByW = Math.floor((availW - boardPad * 2) / spanCols);
    const sizeByH = Math.floor((availH - boardPad * 2) / spanRows);
    cellSize = Math.max(16, Math.min(sizeByW, sizeByH, boardZoomMode ? 132 : 90));
    if (intersect) boardPad = Math.max(14, Math.floor(cellSize * 0.56));

    const cssW = boardPad * 2 + spanCols * cellSize, cssH = boardPad * 2 + spanRows * cellSize;
    dpr = Math.min(window.devicePixelRatio || 1, 3);
    canvas.style.width = `${cssW}px`; canvas.style.height = `${cssH}px`;
    canvas.width = Math.floor(cssW * dpr); canvas.height = Math.floor(cssH * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ==================== SAVE / LOAD (ALL 6 GAMES) ====================
  const GAME_LABELS = { jungle: '🦁 鬥獸棋', xiangqi: '🏯 中國象棋', banqi: '🎴 盲棋', chess: '♟️ 國際象棋', go: '⚫ 圍棋', othello: '⚪ 黑白棋' };
  function readSaves() { try { const r = localStorage.getItem(SAVE_STORAGE_KEY); return r ? JSON.parse(r) : []; } catch (_) { return []; } }
  function writeSaves(list) { try { localStorage.setItem(SAVE_STORAGE_KEY, JSON.stringify(list)); return true; } catch (_) { return false; } }

  function renderSaveList() {
    const list = readSaves();
    document.getElementById('saveCountLabel').textContent = `${list.length} 個存檔`;
    const c = document.getElementById('saveListContainer');
    c.innerHTML = '';
    if (list.length === 0) { c.innerHTML = '<div style="text-align:center;color:#94a3b8;font-size:12.5px;padding:18px 0;">暫時未有存檔，輸入名稱按「儲存」即可隨時續捉！</div>'; return; }
    list.forEach(item => {
      const row = document.createElement('div'); row.className = 'save-item';
      const info = document.createElement('div'); info.className = 'save-item-info';
      const nm = document.createElement('div'); nm.className = 'save-item-name'; nm.textContent = item.name;
      const mt = document.createElement('div'); mt.className = 'save-item-meta'; mt.textContent = `${GAME_LABELS[item.game] || item.game} · ${item.date} · 第 ${item.moves} 步`;
      info.appendChild(nm); info.appendChild(mt);
      const btns = document.createElement('div'); btns.className = 'save-item-btns';
      const lb = document.createElement('button'); lb.type = 'button'; lb.className = 'mini-btn load'; lb.textContent = '續捉';
      lb.addEventListener('click', () => loadSavedGame(item));
      const db = document.createElement('button'); db.type = 'button'; db.className = 'mini-btn del'; db.textContent = '刪除';
      db.addEventListener('click', () => { writeSaves(readSaves().filter(s => s.id !== item.id)); renderSaveList(); showToast('已刪除存檔'); });
      btns.appendChild(lb); btns.appendChild(db);
      row.appendChild(info); row.appendChild(btns); c.appendChild(row);
    });
  }

    const shortName = { jungle:'鬥獸棋', xiangqi:'中國象棋', banqi:'盲棋', chess:'國際象棋', go:'圍棋', othello:'黑白棋' }[currentGame];
    document.getElementById('saveNameInput').value = `${shortName} (${formatDateNow().slice(5, 10)})`;
    renderSaveList();
    document.getElementById('saveModal').classList.add('open');

  function saveCurrentGame() {
    const st = getActiveState();
    const nm = (document.getElementById('saveNameInput').value || '').trim() || `${GAME_LABELS[currentGame]} ${formatDateNow()}`;
    const entry = { id: `save_${Date.now()}`, name: nm, game: currentGame, date: formatDateNow(), moves: st.history.length, state: snapshotForUndo(st) };
    const list = readSaves(); list.unshift(entry);
    if (writeSaves(list)) { renderSaveList(); showToast(`已存檔：「${nm}」`); }
    else showToast('瀏覽器空間不足，請試用「匯出備份」');
  }

  function loadSavedGame(item) {
    if (!item || !item.state || !(item.game in games)) return;
    activeAnim = null; flipAnims = [];
    currentGame = item.game;
    const creators = { jungle: createJungleState, xiangqi: createXiangqiState, banqi: createBanqiState, chess: createChessState, go: () => createGoState(item.state.size || 9), othello: createOthelloState };
    const base = creators[item.game]();
    Object.assign(base, JSON.parse(JSON.stringify(item.state)));
    base.selectedId = null; base.validMoves = []; base.history = [];
    base.gameOver = false; base.winner = null; base.timerRunning = true; base.turnStartTs = Date.now();
    games[item.game] = base;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.game === currentGame));
    document.getElementById('saveModal').classList.remove('open');
    updateUI(); resizeCanvas();
    showToast(`已載入：「${item.name}」`);
  }

  // ==================== TRUE PURE-BOARD ZOOM TOGGLE ====================
  function setBoardZoom(on) {
    boardZoomMode = on;
    const shell = document.getElementById('appShell');
    const topBar = document.getElementById('topBar');
    const p1 = document.getElementById('p1Panel');
    const p2 = document.getElementById('p2Panel');
    const hint = document.getElementById('statusHint');
    const nav = document.getElementById('gameNav');
    const floatBtn = document.getElementById('btnExitZoomFloat');

    if (boardZoomMode) {
      shell.classList.add('zoom-pure');
      topBar.classList.add('hidden');
      p1.classList.add('hidden'); p2.classList.add('hidden');
      hint.classList.add('hidden'); nav.classList.add('hidden');
      floatBtn.classList.add('visible');
    } else {
      shell.classList.remove('zoom-pure');
      topBar.classList.remove('hidden');
      p1.classList.remove('hidden'); p2.classList.remove('hidden');
      hint.classList.remove('hidden'); nav.classList.remove('hidden');
      floatBtn.classList.remove('visible');
    }
    playSound('select');
    updateUI();
    requestAnimationFrame(resizeCanvas);
  }

  // ==================== SWITCH GAME & RULES ====================
  function switchGame(gk) {
    if (currentGame === gk) return;
    activeAnim = null; flipAnims = [];
    particles = []; ripples = []; slashes = []; pawPrints = []; floatingTexts = [];
    currentGame = gk;
    document.querySelectorAll('.nav-item').forEach(b => b.classList.toggle('active', b.dataset.game === gk));
    playSound('select');
    updateUI();
    requestAnimationFrame(resizeCanvas);
  }

  function openRulesModal() {
    const t = document.getElementById('rulesTitle'), l = document.getElementById('rulesList');
    const map = {
      jungle: ['📖 鬥獸棋正統規則', `
        <li><strong>1. 大小次序：</strong>象(8) &gt; 獅(7) &gt; 虎(6) &gt; 豹(5) &gt; 狼(4) &gt; 狗(3) &gt; 貓(2) &gt; 鼠(1)，同級可互食。</li>
        <li><strong style="color:#b91c1c;">2. 鼠食象：</strong>老鼠可食大象，大象唔食得老鼠。</li>
        <li><strong style="color:#1d4ed8;">3. 落水與跳河：</strong>只有老鼠可落河（水中唔食得岸上）；獅子同老虎可跳過無老鼠阻擋嘅河道。</li>
        <li><strong style="color:#7e22ce;">4. 陷阱與獸穴：</strong>敵棋踩我方陷阱戰力變 0；攻入對方獸穴或食曬敵棋即勝出！</li>`],
      xiangqi: ['📖 中國象棋規則', `
        <li><strong>1. 面對面對弈：</strong>黑棋自動倒轉 180°，兩個人坐對面直接捉。</li>
        <li><strong>2. 行法：</strong>俥/車直走、炮/砲隔山打牛食子、傌/馬走日（蹩馬腳）、相/象飛田（塞象眼唔過河）、仕/士行斜、帥/將九宮內行一格。</li>
        <li><strong>3. 勝負：</strong>紅帥黑將唔可以直線照面，絕殺將死對方主帥即勝出！</li>`],
      banqi: ['📖 盲棋（暗棋）規則', `
        <li><strong>1. 隨機蓋棋：</strong>32 隻象棋隨機覆蓋喺 4×8 棋盤，第一步翻開嘅顏色歸下方玩家。</li>
        <li><strong>2. 大小：</strong>帥/將 &gt; 仕/士 &gt; 相/象 &gt; 俥/車 &gt; 傌/馬 &gt; 炮/砲 &gt; 兵/卒；<strong>兵/卒可食帥/將</strong>。</li>
        <li><strong>3. 炮/砲特技：</strong>跳過中間任何 1 隻棋（明或蓋）即可食對面任何級數敵棋！</li>`],
      chess: ['📖 國際象棋規則', `
        <li><strong>1. 面對面對弈：</strong>上方黑棋自動倒轉 180°，白先黑後。</li>
        <li><strong>2. 完整規則：</strong>支援王車易位（Castling）、吃過路兵（En Passant）、小兵到頂自動升變皇后。</li>
        <li><strong>3. 勝負：</strong>將死對方國王（Checkmate）即勝出，無路可走但未被將軍則為逼和。</li>`],
      go: ['📖 圍棋規則', `
        <li><strong>1. 黑先白後：</strong>輪流喺交叉點落子，上方可隨時切換 9路／13路／19路棋盤。</li>
        <li><strong>2. 提子與禁著點：</strong>包圍敵棋令其無氣即自動提子；禁止自殺及即時打劫回提。</li>
        <li><strong>3. 終局點目：</strong>雙方連續按「虛手 (Pass)」自動點目（黑子+黑地 vs 白子+白地+貼目）分勝負！</li>`],
      othello: ['📖 黑白棋（Reversi）規則', `
        <li><strong>1. 夾擊翻轉：</strong>落子必須喺橫、直或斜向夾住至少一隻對方棋子，被夾棋子會全部翻轉成自己顏色。</li>
        <li><strong>2. 無步自動過：</strong>若一方無合法落點會自動跳過回合。</li>
        <li><strong>3. 勝負：</strong>棋盤填滿或雙方均無步可行時，棋子較多一方勝出！</li>`]
    };
    const [title, html] = map[currentGame];
    t.textContent = title; l.innerHTML = html;
    document.getElementById('rulesModal').classList.add('open');
  }

  function resetCurrentGame() {
    activeAnim = null; flipAnims = [];
    particles = []; ripples = []; slashes = []; pawPrints = []; floatingTexts = [];
    if (currentGame === 'jungle') games.jungle = createJungleState();
    else if (currentGame === 'xiangqi') games.xiangqi = createXiangqiState();
    else if (currentGame === 'banqi') games.banqi = createBanqiState();
    else if (currentGame === 'chess') games.chess = createChessState();
    else if (currentGame === 'go') games.go = createGoState(games.go ? games.go.size : 9);
    else games.othello = createOthelloState();
    document.getElementById('victoryModal').classList.remove('open');
    updateUI(); resizeCanvas();
  }

  // ==================== EVENT LISTENERS ====================
  document.querySelectorAll('.nav-item').forEach(btn => btn.addEventListener('click', () => switchGame(btn.dataset.game)));
  document.querySelectorAll('[data-gosize]').forEach(btn => {
    btn.addEventListener('click', () => {
      const sz = Number(btn.dataset.gosize);
      if (games.go && games.go.size === sz) return;
      games.go = createGoState(sz);
      playSound('select'); updateUI(); resizeCanvas();
      showToast(`已切換至 ${sz}×${sz} 圍棋盤`);
    });
  });
  document.getElementById('btnGoPass').addEventListener('click', executeGoPass);
  document.querySelectorAll('[data-chessstyle]').forEach(btn => {
    btn.addEventListener('click', () => {
      chessPieceStyle = btn.dataset.chessstyle;
      document.querySelectorAll('[data-chessstyle]').forEach(b => b.classList.toggle('active', b.dataset.chessstyle === chessPieceStyle));
      playSound('select');
      showToast(chessPieceStyle === '3d' ? '已切換為立體國際象棋' : '已切換為平面國際象棋');
    });
  });

  document.getElementById('btnSaveLoad').addEventListener('click', openSaveModal);
  document.getElementById('btnCloseSave').addEventListener('click', () => document.getElementById('saveModal').classList.remove('open'));
  document.getElementById('saveModal').addEventListener('click', (e) => { if (e.target.id === 'saveModal') e.target.classList.remove('open'); });
  document.getElementById('btnDoSave').addEventListener('click', saveCurrentGame);

  document.getElementById('btnExportSaves').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(readSaves(), null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = `family_chess_saves_${formatDateNow().slice(0, 10)}.json`;
    a.click(); URL.revokeObjectURL(url); showToast('已匯出存檔備份');
  });
  document.getElementById('btnImportSaves').addEventListener('click', () => document.getElementById('importFileInput').click());
  document.getElementById('importFileInput').addEventListener('change', (e) => {
    const file = e.target.files && e.target.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const imp = JSON.parse(String(reader.result));
        if (!Array.isArray(imp)) throw new Error();
        const merged = [...imp, ...readSaves()].filter((v, i, arr) => arr.findIndex(x => x.id === v.id) === i);
        writeSaves(merged); renderSaveList(); showToast(`成功匯入 ${imp.length} 個存檔！`);
      } catch (_) { showToast('存檔格式唔啱，匯入失敗'); }
    };
    reader.readAsText(file); e.target.value = '';
  });

  document.getElementById('btnAnimToggle').addEventListener('click', () => {
    animationsEnabled = !animationsEnabled;
    const b = document.getElementById('btnAnimToggle');
    if (animationsEnabled) { b.classList.add('btn-anim-on'); b.innerHTML = '✨ <span class="btn-label">動畫開</span>'; showToast('已開啟動態棋盤與棋子動畫'); }
    else { b.classList.remove('btn-anim-on'); b.innerHTML = '⚡ <span class="btn-label">動畫關</span>'; showToast('已關閉動畫（經典即時模式）'); }
    playSound('select');
  });

  document.getElementById('btnUndo').addEventListener('click', () => {
    const st = getActiveState();
    if (activeAnim || st.history.length === 0) return;
    const prev = st.history.pop();
    Object.assign(st, prev);
    st.selectedId = null; st.validMoves = []; st.gameOver = false; st.winner = null;
    document.getElementById('victoryModal').classList.remove('open');
    if (st.history.length === 0) { st.timerRunning = false; st.turnStartTs = 0; } else startTurnTimer(st);
    playSound('select'); updateUI();
  });

  document.getElementById('btnSound').addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    document.getElementById('btnSound').innerHTML = soundEnabled ? '🔊 <span class="btn-label">音效</span>' : '🔇 <span class="btn-label">靜音</span>';
    if (soundEnabled) playSound('select');
  });

  document.getElementById('btnBoardZoom').addEventListener('click', () => setBoardZoom(true));
  document.getElementById('btnExitZoomFloat').addEventListener('click', () => setBoardZoom(false));

  document.getElementById('btnRules').addEventListener('click', openRulesModal);
  document.getElementById('btnCloseRules').addEventListener('click', () => document.getElementById('rulesModal').classList.remove('open'));
  document.getElementById('btnCloseRulesBottom').addEventListener('click', () => document.getElementById('rulesModal').classList.remove('open'));
  document.getElementById('rulesModal').addEventListener('click', (e) => { if (e.target.id === 'rulesModal') e.target.classList.remove('open'); });

  document.getElementById('btnRestart').addEventListener('click', () => {
    const st = getActiveState();
    if (st.history.length === 0 || st.gameOver) resetCurrentGame();
    else document.getElementById('restartModal').classList.add('open');
  });
  document.getElementById('btnCancelRestart').addEventListener('click', () => document.getElementById('restartModal').classList.remove('open'));
  document.getElementById('btnConfirmRestart').addEventListener('click', () => { document.getElementById('restartModal').classList.remove('open'); resetCurrentGame(); });
  document.getElementById('btnCloseVictory').addEventListener('click', () => document.getElementById('victoryModal').classList.remove('open'));
  document.getElementById('btnPlayAgain').addEventListener('click', resetCurrentGame);

  document.addEventListener('touchstart', () => ensureAudio(), { once: true, passive: true });
  window.addEventListener('resize', resizeCanvas);
  window.addEventListener('orientationchange', () => { setTimeout(resizeCanvas, 150); setTimeout(resizeCanvas, 350); });
  if (window.visualViewport) window.visualViewport.addEventListener('resize', () => requestAnimationFrame(resizeCanvas));
  if (typeof ResizeObserver !== 'undefined') new ResizeObserver(resizeCanvas).observe(document.getElementById('boardStage'));

  function boot() {
    games.jungle = createJungleState();
    games.xiangqi = createXiangqiState();
    games.banqi = createBanqiState();
    games.chess = createChessState();
    games.go = createGoState(9);
    games.othello = createOthelloState();
    updateUI();
    resizeCanvas();
    requestAnimationFrame(resizeCanvas);
    if (timerIntervalId) clearInterval(timerIntervalId);
    timerIntervalId = setInterval(updateTimerDisplay, 250);
    if (rafId) cancelAnimationFrame(rafId);
    rafId = requestAnimationFrame(loop);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
  window.addEventListener('load', resizeCanvas);
})();
</script>
</body>
</html>
