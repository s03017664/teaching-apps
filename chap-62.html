<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DSE 化學：液液萃取微觀模擬平台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }
        canvas {
            border-radius: 0.5rem;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.1);
        }
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1; 
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1; 
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8; 
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <div class="max-w-6xl w-full flex flex-col gap-6">
        <!-- Header -->
        <header class="text-center mb-4">
            <h1 class="text-3xl md:text-4xl font-bold text-slate-800 mb-2">DSE 化學：液液萃取微觀模擬</h1>
            <p class="text-slate-600">從微觀角度觀察有機溶質在不同溶劑及酸鹼環境中的分佈</p>
        </header>

        <!-- Main Content -->
        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            
            <!-- Left Panel: Controls and Macro View -->
            <div class="lg:col-span-5 flex flex-col gap-4">
                <!-- Controls -->
                <div class="glass-panel rounded-2xl p-6">
                    <h2 class="text-xl font-semibold text-slate-800 mb-4 flex items-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"></path></svg>
                        實驗設置
                    </h2>
                    
                    <div class="space-y-4">
                        <!-- Organic Solvent -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">有機層 (Organic Layer)</label>
                            <select id="organic-select" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option value="hexane">己烷 (Hexane) - 密度 0.66 g/cm³</option>
                                <option value="dcm">二氯甲烷 (DCM) - 密度 1.33 g/cm³</option>
                            </select>
                        </div>

                        <!-- Aqueous Solvent -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">水層 (Aqueous Layer)</label>
                            <select id="aqueous-select" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option value="water">蒸餾水 (H₂O)</option>
                                <option value="naoh">稀氫氧化鈉溶液 (NaOH)</option>
                                <option value="hcl">稀鹽酸 (HCl)</option>
                            </select>
                        </div>

                        <!-- Solute -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">溶質 (Solute)</label>
                            <select id="solute-select" class="w-full rounded-lg border-slate-300 border p-2.5 focus:ring-blue-500 focus:border-blue-500 bg-white">
                                <option value="iodine">碘 (Iodine) - 非極性</option>
                                <option value="naphthalene">萘 (Naphthalene) - 非極性</option>
                                <option value="benzoic">苯甲酸 (Benzoic Acid) - 弱酸性</option>
                                <option value="phenol">苯酚 (Phenol) - 弱酸性</option>
                                <option value="phenylamine">苯胺 (Phenylamine) - 弱鹼性</option>
                            </select>
                        </div>

                        <!-- Initial Location -->
                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-1">溶質初始所在溶液</label>
                            <div class="flex gap-4">
                                <label class="flex items-center">
                                    <input type="radio" name="initial-layer" value="aq" class="mr-2" checked> 水層
                                </label>
                                <label class="flex items-center">
                                    <input type="radio" name="initial-layer" value="org" class="mr-2"> 有機層
                                </label>
                            </div>
                        </div>

                        <hr class="border-slate-200">

                        <!-- Actions -->
                        <div class="grid grid-cols-2 gap-3" id="action-buttons">
                            <button id="btn-add" class="col-span-2 bg-emerald-600 hover:bg-emerald-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm flex justify-center items-center">
                                加入提取溶劑 (Add Solvent)
                            </button>
                            <button id="btn-shake" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm flex justify-center items-center">
                                劇烈搖勻 (Shake)
                            </button>
                            <button id="btn-settle" class="hidden bg-indigo-500 hover:bg-indigo-600 text-white font-medium py-2 px-4 rounded-lg transition-colors shadow-sm flex justify-center items-center" disabled>
                                靜置分層 (Settle)
                            </button>
                        </div>
                        <div class="pt-2">
                            <label class="block text-sm font-medium text-slate-700 mb-1">微觀模擬速度 (緩慢展示)</label>
                            <input type="range" id="speed-slider" min="1" max="10" value="3" class="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>

                <!-- Macro View: Separating Funnel -->
                <div class="glass-panel rounded-2xl p-6 flex flex-col items-center flex-grow relative">
                    <h2 class="text-lg font-semibold text-slate-800 mb-4">巨觀視角：分液漏斗</h2>
                    
                    <div class="relative w-48 h-64 flex justify-center items-center">
                        <!-- Funnel SVG -->
                        <svg viewBox="0 0 120 220" class="w-full h-full drop-shadow-md relative z-10" preserveAspectRatio="xMidYMid meet">
                            <defs>
                                <clipPath id="funnel-clip">
                                    <path d="M 20 20 C 20 5, 100 5, 100 20 L 100 90 C 100 130, 70 150, 65 170 L 65 200 L 55 200 L 55 170 C 50 150, 20 130, 20 90 Z" />
                                </clipPath>
                                <linearGradient id="glass-glare" x1="0%" y1="0%" x2="100%" y2="0%">
                                    <stop offset="0%" stop-color="rgba(255,255,255,0.7)" />
                                    <stop offset="20%" stop-color="rgba(255,255,255,0.1)" />
                                    <stop offset="80%" stop-color="rgba(255,255,255,0)" />
                                    <stop offset="100%" stop-color="rgba(255,255,255,0.3)" />
                                </linearGradient>
                            </defs>
                            
                            <!-- Liquid Layers (Clipped) -->
                            <g clip-path="url(#funnel-clip)">
                                <!-- Top Layer -->
                                <rect id="macro-top-layer" x="0" y="20" width="120" height="75" fill="#fef08a" transition="fill 0.5s"/>
                                <!-- Bottom Layer -->
                                <rect id="macro-bottom-layer" x="0" y="95" width="120" height="105" fill="#bae6fd" transition="fill 0.5s"/>
                                
                                <!-- Shake State Overlay -->
                                <rect id="macro-shake-layer" x="0" y="20" width="120" height="180" fill="#a7f3d0" opacity="0" transition="opacity 0.3s"/>
                            </g>
                            
                            <!-- Funnel Outline -->
                            <path d="M 20 20 C 20 5, 100 5, 100 20 L 100 90 C 100 130, 70 150, 65 170 L 65 200 L 55 200 L 55 170 C 50 150, 20 130, 20 90 Z" fill="none" stroke="#94a3b8" stroke-width="3"/>
                            
                            <!-- Glass Glare -->
                            <path d="M 20 20 C 20 5, 100 5, 100 20 L 100 90 C 100 130, 70 150, 65 170 L 65 200 L 55 200 L 55 170 C 50 150, 20 130, 20 90 Z" fill="url(#glass-glare)" pointer-events="none"/>
                            
                            <!-- Stopcock -->
                            <rect x="45" y="185" width="30" height="8" rx="2" fill="#64748b"/>
                            <rect x="58" y="175" width="4" height="28" fill="#475569"/>
                            
                            <!-- Stopper -->
                            <path d="M 40 10 L 80 10 L 75 22 L 45 22 Z" fill="#cbd5e1" stroke="#94a3b8" stroke-width="2"/>
                            
                            <!-- Interface Line -->
                            <line id="macro-interface-line" x1="20" y1="95" x2="100" y2="95" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="4"/>
                        </svg>
                        
                        <!-- Magnifying Glass Indicator -->
                        <div id="magnifier-line" class="absolute hidden lg:flex items-center" style="right: -40px; top: 40%;">
                            <div class="w-10 h-0.5 bg-slate-400 border-dashed border-b-2"></div>
                            <svg class="w-6 h-6 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"></path></svg>
                        </div>
                    </div>
                    
                    <div class="mt-4 text-sm font-medium text-slate-600 w-full">
                        <div class="flex justify-between items-center mb-1">
                            <span class="inline-block w-4 h-4 rounded-full" id="legend-top-color"></span>
                            <span id="legend-top-text" class="flex-1 ml-2">上層: --</span>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="inline-block w-4 h-4 rounded-full" id="legend-bottom-color"></span>
                            <span id="legend-bottom-text" class="flex-1 ml-2">下層: --</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Right Panel: Microscopic View and Explanation -->
            <div class="lg:col-span-7 flex flex-col gap-4">
                <div class="glass-panel rounded-2xl p-6 flex flex-col h-full shadow-lg border-blue-100">
                    <div class="flex justify-between items-end mb-4">
                        <h2 class="text-xl font-semibold text-slate-800 flex items-center">
                            <svg class="w-5 h-5 mr-2 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path></svg>
                            放大微觀視角 (液面交界處)
                        </h2>
                        <span id="state-badge" class="px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-600">狀態: 靜置</span>
                    </div>

                    <!-- Canvas Container -->
                    <div class="relative w-full aspect-square md:aspect-video lg:aspect-square xl:aspect-video bg-white rounded-xl overflow-hidden mb-4 border border-slate-200">
                        <canvas id="micro-canvas" class="w-full h-full"></canvas>
                        
                        <!-- Layer Labels on Canvas -->
                        <div class="absolute top-2 left-2 bg-white/80 px-2 py-1 rounded text-xs font-semibold shadow-sm text-slate-700 backdrop-blur-sm" id="micro-top-label">
                            上層溶劑
                        </div>
                        <div class="absolute bottom-2 left-2 bg-white/80 px-2 py-1 rounded text-xs font-semibold shadow-sm text-slate-700 backdrop-blur-sm" id="micro-bottom-label">
                            下層溶劑
                        </div>
                    </div>

                    <!-- Chemical Explanation -->
                    <div class="bg-blue-50/50 p-4 rounded-xl border border-blue-100 mt-auto">
                        <h3 class="font-semibold text-blue-900 mb-2 flex items-center">
                            <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                            化學原理解釋
                        </h3>
                        <p id="explanation-text" class="text-sm text-slate-700 leading-relaxed">
                            請選擇溶劑及溶質，並點擊「搖勻」觀察溶質分子的轉移。
                        </p>
                    </div>
                </div>
            </div>
            
        </div>
    </div>

    <script>
        // --- Data & Configuration ---
        const SOLVENTS = {
            organic: {
                hexane: { name: '己烷 (Hexane)', density: 0.66, color: '#fef08a', microColor: 'rgba(254, 240, 138, 0.4)' },
                dcm: { name: '二氯甲烷 (DCM)', density: 1.33, color: '#fca5a5', microColor: 'rgba(252, 165, 165, 0.4)' },
                ethyl_ethanoate: { name: '乙酸乙酯 (Ethyl Ethanoate)', density: 0.90, color: '#fde047', microColor: 'rgba(253, 224, 71, 0.4)' },
                ethoxyethane: { name: '乙醚 (Ethoxyethane)', density: 0.71, color: '#d9f99d', microColor: 'rgba(217, 249, 157, 0.4)' }
            },
            aqueous: {
                water: { name: '水 (H₂O)', density: 1.00, color: '#bae6fd', microColor: 'rgba(186, 230, 253, 0.4)' },
                naoh: { name: '稀NaOH (aq)', density: 1.02, color: '#bfdbfe', microColor: 'rgba(191, 219, 254, 0.4)' },
                hcl: { name: '稀HCl (aq)', density: 1.02, color: '#a7f3d0', microColor: 'rgba(167, 243, 208, 0.4)' },
                nahco3: { name: 'NaHCO₃ (aq)', density: 1.03, color: '#c7d2fe', microColor: 'rgba(199, 210, 254, 0.4)' }
            }
        };

        const SOLUTES = {
            iodine: {
                name: '碘 (I₂)',
                color: '#7e22ce', // Purple
                particleType: 'circle',
                // Returns % going to Organic layer
                getOrganicPartition: (aq) => {
                    return 0.95; 
                },
                getExplanation: (aq, org) => {
                    return `碘 (I₂) 是一種非極性分子。根據「相似相溶」原理，它較易溶於非極性的有機溶劑（如${SOLVENTS.organic[org].name}）中，而極少溶於水層。`;
                }
            },
            naphthalene: {
                name: '萘 (Naphthalene)',
                color: '#475569', 
                particleType: 'circle',
                getOrganicPartition: (aq) => 0.98,
                getExplanation: (aq, org) => `萘是一種完全非極性的芳香族碳氫化合物。它極難溶於水，強烈傾向留在非極性/微極性的有機溶劑（如${SOLVENTS.organic[org].name}）中。`
            },
            benzoic: {
                name: '苯甲酸',
                color: '#1d4ed8', // Blue
                particleType: 'hexagon',
                getOrganicPartition: (aq) => {
                    if (aq === 'naoh' || aq === 'nahco3') return 0.05; // Reacts with both
                    return 0.85; 
                },
                getExplanation: (aq, org) => {
                    if (aq === 'naoh' || aq === 'nahco3') {
                        return `苯甲酸具有弱酸性，能與氫氧化鈉 (NaOH) 或弱鹼碳酸氫鈉 (NaHCO₃) 發生酸鹼中和反應，生成易溶於水的苯甲酸鹽。因此，大量溶質轉移到水層。`;
                    } else {
                        return `苯甲酸分子雖然含有極性的羧基，但巨大的苯環使其整體偏向非極性。在無鹼性物質反應的情況下，較傾向留在有機層（${SOLVENTS.organic[org].name}）。`;
                    }
                }
            },
            phenol: {
                name: '苯酚',
                color: '#ea580c', // Orange
                particleType: 'hexagon',
                getOrganicPartition: (aq) => {
                    if (aq === 'naoh') return 0.05; // Reacts with strong base
                    if (aq === 'nahco3') return 0.85; // Does not react with weak base
                    return 0.85; 
                },
                getExplanation: (aq, org) => {
                    if (aq === 'naoh') {
                        return `苯酚具弱酸性，能與強鹼 (NaOH) 反應生成易溶於水的苯氧化鈉 (Sodium phenoxide)，因此轉移至水層。`;
                    } else if (aq === 'nahco3') {
                        return `苯酚酸性極弱，不足以與弱鹼 (NaHCO₃) 產生反應，因此仍保持分子狀態，主要留在有機層。這特性常用於與能和 NaHCO₃ 反應的苯甲酸進行分離。`;
                    } else {
                        return `苯酚雖有極性羥基，但苯環使其整體偏向非極性，在沒有強鹼的情況下較傾向留在有機層。`;
                    }
                }
            },
            phenylamine: {
                name: '苯胺',
                color: '#15803d', // Green
                particleType: 'triangle',
                getOrganicPartition: (aq) => {
                    // Phenylamine reacts with HCl to form water-soluble phenylammonium chloride
                    if (aq === 'hcl') return 0.05; // Most goes to Aq
                    return 0.80; // Prefers organic
                },
                getExplanation: (aq, org) => {
                    if (aq === 'hcl') {
                        return `苯胺具有弱鹼性。當加入鹽酸 (HCl) 時，會發生酸鹼中和反應，生成易溶於水的苯基氯化銨 (Phenylammonium chloride) 鹽類。因此，溶質會大量轉移至水層。`;
                    } else {
                        return `苯胺分子含氨基，雖可形成氫鍵，但苯環使其整體偏向非極性。在沒有酸性物質反應的情況下，它更傾向分佈在有機層（${SOLVENTS.organic[org].name}）中。`;
                    }
                }
            }
        };

        // --- State Management ---
        let currentState = {
            org: 'hexane',
            aq: 'water',
            solute: 'iodine',
            initialLocation: 'aq',
            status: 'INITIAL', // INITIAL, ADDED, SHAKING, SETTLING, SETTLED
            speed: 3
        };

        let currentLayers = { top: null, bottom: null }; 
        // --- Canvas Setup ---
        const canvas = document.getElementById('micro-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        const NUM_PARTICLES = 120;
        let animationId;

        function resizeCanvas() {
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
        }
        window.addEventListener('resize', resizeCanvas);

        // --- Simulation Logic ---

        class Particle {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = 4 + Math.random() * 2;
                this.color = color;
                this.type = type; // circle, hexagon, triangle
                this.targetLayer = null; // 'top' or 'bottom'
                this.currentZone = y < canvas.height/2 ? 'top' : 'bottom';
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.beginPath();
                if (this.type === 'circle') {
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                } else if (this.type === 'hexagon') {
                    for (let i = 0; i < 6; i++) {
                        const angle = 2 * Math.PI / 6 * i;
                        const px = this.x + this.radius * 1.2 * Math.cos(angle);
                        const py = this.y + this.radius * 1.2 * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                } else if (this.type === 'triangle') {
                    ctx.moveTo(this.x, this.y - this.radius);
                    ctx.lineTo(this.x + this.radius, this.y + this.radius);
                    ctx.lineTo(this.x - this.radius, this.y + this.radius);
                }
                ctx.closePath();
                ctx.fill();
            }

            update(status, speedMod) {
                // Update position
                this.x += this.vx * speedMod;
                this.y += this.vy * speedMod;
                
                this.currentZone = this.y < canvas.height/2 ? 'top' : 'bottom';

                // Bounce off walls
                if (this.x - this.radius < 0) { this.x = this.radius; this.vx *= -1; }
                if (this.x + this.radius > canvas.width) { this.x = canvas.width - this.radius; this.vx *= -1; }
                
                // Top and bottom boundaries depend on status
                let minY = 0;
                let maxY = canvas.height;

                if (status === 'INITIAL') {
                    // Only in bottom half (where the single liquid is)
                    minY = canvas.height / 2;
                } else if (status === 'ADDED') {
                    // Confined to their initial layer before shaking
                    const initialIsTop = (currentLayers.top.type === currentState.initialLocation);
                    if (initialIsTop) { maxY = canvas.height / 2; } 
                    else { minY = canvas.height / 2; }
                }

                if (this.y - this.radius < minY) { this.y = minY + this.radius; this.vy *= -1; }
                if (this.y + this.radius > maxY) { this.y = maxY - this.radius; this.vy *= -1; }

                if (status === 'SHAKING') {
                    // Random chaotic movement
                    this.vx += (Math.random() - 0.5) * 2;
                    this.vy += (Math.random() - 0.5) * 2;
                    // Cap speed
                    const maxSpeed = 10;
                    if (this.vx > maxSpeed) this.vx = maxSpeed;
                    if (this.vx < -maxSpeed) this.vx = -maxSpeed;
                    if (this.vy > maxSpeed) this.vy = maxSpeed;
                    if (this.vy < -maxSpeed) this.vy = -maxSpeed;

                } else if (status === 'SETTLING') {
                    // Slow down chaotic movement
                    this.vx *= 0.95;
                    this.vy *= 0.95;

                    // Migrate to target layer
                    const interfaceY = canvas.height / 2;
                    const force = 0.05 * currentState.speed; // Speed slider controls migration force

                    if (this.targetLayer === 'top' && this.y > interfaceY - 20) {
                        this.vy -= force; 
                    } else if (this.targetLayer === 'bottom' && this.y < interfaceY + 20) {
                        this.vy += force;
                    } else {
                        // Gentle random Brownian motion in target layer
                        this.vx += (Math.random() - 0.5) * 0.2;
                        this.vy += (Math.random() - 0.5) * 0.2;
                        
                        // Prevent crossing boundary back if settled
                        if (this.targetLayer === 'top' && this.y > interfaceY - 5) {
                            this.vy = -Math.abs(this.vy);
                        } else if (this.targetLayer === 'bottom' && this.y < interfaceY + 5) {
                            this.vy = Math.abs(this.vy);
                        }
                    }
                    
                    // Base speed limit during settling
                    const baseMax = 2 + (currentState.speed * 0.5);
                    if (this.vx > baseMax) this.vx = baseMax;
                    if (this.vx < -baseMax) this.vx = -baseMax;
                    if (this.vy > baseMax) this.vy = baseMax;
                    if (this.vy < -baseMax) this.vy = -baseMax;

                } else if (status === 'SETTLED') {
                    // Gentle Brownian motion strictly within layer
                    this.vx += (Math.random() - 0.5) * 0.1;
                    this.vy += (Math.random() - 0.5) * 0.1;
                    
                    const maxSpeed = 1.5;
                    if (this.vx > maxSpeed) this.vx = maxSpeed;
                    if (this.vx < -maxSpeed) this.vx = -maxSpeed;
                    if (this.vy > maxSpeed) this.vy = maxSpeed;
                    if (this.vy < -maxSpeed) this.vy = -maxSpeed;

                    const interfaceY = canvas.height / 2;
                    if (this.targetLayer === 'top') {
                        if (this.y > interfaceY - this.radius) {
                            this.y = interfaceY - this.radius;
                            this.vy *= -1;
                        }
                    } else {
                         if (this.y < interfaceY + this.radius) {
                            this.y = interfaceY + this.radius;
                            this.vy *= -1;
                        }
                    }
                }
            }
        }

        function determineLayers() {
            const org = SOLVENTS.organic[currentState.org];
            const aq = SOLVENTS.aqueous[currentState.aq];
            
            if (org.density < aq.density) {
                currentLayers.top = { type: 'org', data: org };
                currentLayers.bottom = { type: 'aq', data: aq };
            } else {
                currentLayers.top = { type: 'aq', data: aq };
                currentLayers.bottom = { type: 'org', data: org };
            }
        }

        function calculatePartition() {
            const soluteDef = SOLUTES[currentState.solute];
            const orgFraction = soluteDef.getOrganicPartition(currentState.aq);
            
            particles.forEach(p => {
                const rand = Math.random();
                if (rand < orgFraction) {
                    p.targetLayer = (currentLayers.top.type === 'org') ? 'top' : 'bottom';
                } else {
                    p.targetLayer = (currentLayers.top.type === 'aq') ? 'top' : 'bottom';
                }
            });
        }

        function initParticles() {
            particles = [];
            const soluteDef = SOLUTES[currentState.solute];
            for (let i = 0; i < NUM_PARTICLES; i++) {
                const x = Math.random() * canvas.width;
                // In INITIAL state, liquid is only in the bottom half of the micro view
                const y = (canvas.height / 2) + Math.random() * ((canvas.height / 2) - 10);
                particles.push(new Particle(x, y, soluteDef.color, soluteDef.particleType));
            }
            calculatePartition();
        }

        // Add shake visual logic
        let shakeOffset = 0;
        let shakeTime = 0;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw Background layers
            if (currentState.status === 'SHAKING') {
                // Mix colors
                ctx.fillStyle = blendColors(currentLayers.top.data.microColor, currentLayers.bottom.data.microColor, 0.5);
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                shakeTime++;
                shakeOffset = Math.sin(shakeTime * 0.8) * 10;
                
                // Emulsion bubbles
                ctx.fillStyle = 'rgba(255,255,255,0.2)';
                for(let i=0; i<20; i++){
                    ctx.beginPath();
                    ctx.arc(
                        (Math.random() * canvas.width + shakeOffset) % canvas.width, 
                        Math.random() * canvas.height, 
                        Math.random() * 15 + 5, 0, Math.PI*2
                    );
                    ctx.fill();
                }

            } else {
                shakeOffset = 0;
                
                if (currentState.status === 'INITIAL') {
                    const initialSolvent = currentState.initialLocation === 'aq' ? 
                        (currentLayers.top.type==='aq'?currentLayers.top.data : currentLayers.bottom.data) : 
                        (currentLayers.top.type==='org'?currentLayers.top.data : currentLayers.bottom.data);
                    
                    // Top half is air, bottom half is the initial solvent
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
                    ctx.fillStyle = initialSolvent.microColor;
                    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);
                    
                    // Draw liquid surface line
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height / 2);
                    ctx.lineTo(canvas.width, canvas.height / 2);
                    ctx.strokeStyle = 'rgba(200,200,200,0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();

                } else {
                    // Settled / Settling / Added backgrounds (Two layers)
                    ctx.fillStyle = currentLayers.top.data.microColor;
                    ctx.fillRect(0, 0, canvas.width, canvas.height / 2);
                    
                    ctx.fillStyle = currentLayers.bottom.data.microColor;
                    ctx.fillRect(0, canvas.height / 2, canvas.width, canvas.height / 2);

                    // Draw interface line
                    ctx.beginPath();
                    ctx.moveTo(0, canvas.height / 2);
                    
                    if (currentState.status === 'SETTLING') {
                        // Wavy interface settling down
                        for(let i=0; i<canvas.width; i+=10) {
                            const wave = Math.sin(i * 0.05 + Date.now()*0.005) * (15 - currentState.speed) * (particles.some(p => Math.abs(p.vx)>2)?1:0.2); // dampen
                            ctx.lineTo(i, canvas.height / 2 + wave);
                        }
                    } else {
                        ctx.lineTo(canvas.width, canvas.height / 2);
                    }
                    
                    ctx.strokeStyle = 'rgba(255,255,255,0.8)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                }
            }

            // Update & Draw particles
            const speedMod = currentState.status === 'SHAKING' ? 2 : (currentState.speed * 0.5);
            particles.forEach(p => {
                p.update(currentState.status, speedMod);
                p.draw(ctx);
            });

            // Update Macro Funnel Shaking effect
            const svgFunnel = document.querySelector('svg');
            if (currentState.status === 'SHAKING') {
                 svgFunnel.style.transform = `translateX(${shakeOffset * 0.5}px) rotate(${shakeOffset*0.2}deg)`;
            } else {
                 svgFunnel.style.transform = `translateX(0px) rotate(0deg)`;
                 svgFunnel.style.transition = 'transform 0.3s';
            }

            animationId = requestAnimationFrame(animate);
        }

        // --- Helper: Color Blender ---
        function blendColors(c1, c2, ratio) {
            // Very naive rgba blender for the shaking state
            return 'rgba(180, 210, 200, 0.5)'; // Simplified mixed emulsion color
        }

        // --- UI Updates ---
        function updateUI() {
            determineLayers();
            
            const topLayerRect = document.getElementById('macro-top-layer');
            const bottomLayerRect = document.getElementById('macro-bottom-layer');
            const shakeLayerRect = document.getElementById('macro-shake-layer');
            const interfaceLine = document.getElementById('macro-interface-line');
            const badge = document.getElementById('state-badge');
            
            if (currentState.status === 'INITIAL') {
                const initialSolvent = currentState.initialLocation === 'aq' ? 
                    (currentLayers.top.type==='aq'?currentLayers.top.data : currentLayers.bottom.data) : 
                    (currentLayers.top.type==='org'?currentLayers.top.data : currentLayers.bottom.data);
                
                // Only bottom layer visible (the single liquid sits at bottom of funnel)
                bottomLayerRect.setAttribute('fill', initialSolvent.color);
                topLayerRect.setAttribute('fill', 'transparent'); 
                interfaceLine.setAttribute('opacity', '0');
                shakeLayerRect.setAttribute('opacity', '0');

                document.getElementById('legend-top-text').innerText = `上層: (未加入)`;
                document.getElementById('legend-bottom-text').innerText = `液體: ${initialSolvent.name}`;
                document.getElementById('legend-top-color').style.backgroundColor = 'transparent';
                document.getElementById('legend-bottom-color').style.backgroundColor = initialSolvent.color;

                document.getElementById('micro-top-label').innerText = '(空氣)';
                document.getElementById('micro-bottom-label').innerText = initialSolvent.name;

                document.getElementById('explanation-text').innerHTML = `<strong>步驟 1</strong>: 溶質目前分佈在單一溶劑中。請點擊「加入提取溶劑」。`;
                
                badge.innerText = '狀態: 加入前';
                badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-slate-200 text-slate-600';

            } else {
                topLayerRect.setAttribute('fill', currentLayers.top.data.color);
                bottomLayerRect.setAttribute('fill', currentLayers.bottom.data.color);

                document.getElementById('legend-top-color').style.backgroundColor = currentLayers.top.data.color;
                document.getElementById('legend-bottom-color').style.backgroundColor = currentLayers.bottom.data.color;
                document.getElementById('legend-top-text').innerText = `上層: ${currentLayers.top.data.name}`;
                document.getElementById('legend-bottom-text').innerText = `下層: ${currentLayers.bottom.data.name}`;

                document.getElementById('micro-top-label').innerText = currentLayers.top.data.name;
                document.getElementById('micro-bottom-label').innerText = currentLayers.bottom.data.name;

                if (currentState.status === 'SHAKING') {
                    shakeLayerRect.setAttribute('opacity', '1');
                    shakeLayerRect.setAttribute('fill', blendColors());
                    interfaceLine.setAttribute('opacity', '0');
                } else {
                    shakeLayerRect.setAttribute('opacity', '0');
                    interfaceLine.setAttribute('opacity', '1');
                }

                // Explanation Text
                const explanation = SOLUTES[currentState.solute].getExplanation(currentState.aq, currentState.org);
                
                if (currentState.status === 'ADDED') {
                     document.getElementById('explanation-text').innerHTML = `<strong>步驟 2</strong>: 已加入另一溶劑。請點擊「劇烈搖勻」使兩層充分接觸。`;
                } else {
                     document.getElementById('explanation-text').innerHTML = `
                        <strong>${SOLUTES[currentState.solute].name}</strong>: ${explanation}
                        <br><br>
                        <em>（觀察：密度較${currentLayers.top.type === 'org' ? '低' : '高'}的有機溶劑位於${currentLayers.top.type === 'org' ? '上' : '下'}層。）</em>
                    `;
                }

                if (currentState.status === 'ADDED') {
                    badge.innerText = '狀態: 準備搖勻';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-emerald-200 text-emerald-800';
                } else if (currentState.status === 'SHAKING') {
                    badge.innerText = '狀態: 搖勻中';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-yellow-200 text-yellow-800 animate-pulse';
                } else if (currentState.status === 'SETTLING') {
                    badge.innerText = '狀態: 靜置分層中...';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-blue-200 text-blue-800';
                } else if (currentState.status === 'SETTLED') {
                    badge.innerText = '狀態: 靜置完成';
                    badge.className = 'px-3 py-1 rounded-full text-xs font-bold bg-green-200 text-green-800';
                }
                
                if (currentState.status === 'SETTLED') {
                    calculatePartition();
                    particles.forEach(p => {
                        const interfaceY = canvas.height / 2;
                        if(p.targetLayer === 'top' && p.y > interfaceY) p.y = interfaceY - Math.random()*50;
                        if(p.targetLayer === 'bottom' && p.y < interfaceY) p.y = interfaceY + Math.random()*50;
                    });
                }
            }
        }

        // --- Event Listeners ---
        // Helper to reset to initial when settings change
        function resetToInitial() {
            currentState.status = 'INITIAL';
            btnAdd.classList.remove('hidden');
            btnAdd.disabled = false;
            btnShake.classList.add('hidden');
            btnSettle.classList.add('hidden');
            initParticles();
            updateUI();
        }

        document.getElementById('organic-select').addEventListener('change', (e) => {
            currentState.org = e.target.value;
            resetToInitial();
        });
        document.getElementById('aqueous-select').addEventListener('change', (e) => {
            currentState.aq = e.target.value;
            resetToInitial();
        });
        document.getElementById('solute-select').addEventListener('change', (e) => {
            currentState.solute = e.target.value;
            resetToInitial();
        });
        document.getElementsByName('initial-layer').forEach(radio => {
            radio.addEventListener('change', (e) => {
                currentState.initialLocation = e.target.value;
                resetToInitial();
            });
        });
        document.getElementById('speed-slider').addEventListener('input', (e) => {
            currentState.speed = parseInt(e.target.value);
        });

        const btnAdd = document.getElementById('btn-add');
        const btnShake = document.getElementById('btn-shake');
        const btnSettle = document.getElementById('btn-settle');

        btnAdd.addEventListener('click', () => {
            currentState.status = 'ADDED';
            
            // Push particles to their designated layer visually based on density
            const initialIsTop = (currentLayers.top.type === currentState.initialLocation);
            particles.forEach(p => {
                if (initialIsTop) {
                    // Initial solvent is less dense, so it floats to top when second solvent is added
                    p.y = Math.random() * ((canvas.height / 2) - 5);
                } else {
                    // Initial solvent is denser, stays at bottom
                    p.y = (canvas.height / 2) + Math.random() * ((canvas.height / 2) - 5);
                }
            });

            btnAdd.classList.add('hidden');
            btnShake.classList.remove('hidden');
            btnSettle.classList.remove('hidden');
            btnShake.disabled = false;
            btnShake.classList.remove('opacity-50', 'cursor-not-allowed');
            
            updateUI();
        });

        btnShake.addEventListener('click', () => {
            currentState.status = 'SHAKING';
            btnShake.disabled = true;
            btnShake.classList.add('opacity-50', 'cursor-not-allowed');
            btnSettle.disabled = false;
            btnSettle.classList.remove('opacity-50', 'cursor-not-allowed');
            
            // Randomize particle positions everywhere
            particles.forEach(p => {
                p.y = Math.random() * canvas.height;
            });
            
            updateUI();
        });

        btnSettle.addEventListener('click', () => {
            currentState.status = 'SETTLING';
            btnSettle.disabled = true;
            btnSettle.classList.add('opacity-50', 'cursor-not-allowed');
            calculatePartition(); 
            updateUI();

            const settleTime = 10000 / currentState.speed; 
            setTimeout(() => {
                if (currentState.status === 'SETTLING') {
                    currentState.status = 'SETTLED';
                    btnShake.disabled = false;
                    btnShake.classList.remove('opacity-50', 'cursor-not-allowed');
                    updateUI();
                }
            }, settleTime);
        });

        // --- Initialization ---
        
        // Add options dynamically in HTML
        document.getElementById('organic-select').innerHTML = `
            <option value="hexane">己烷 (Hexane) - 密度 0.66 g/cm³</option>
            <option value="ethoxyethane">乙醚 (Ethoxyethane) - 密度 0.71 g/cm³</option>
            <option value="ethyl_ethanoate">乙酸乙酯 (Ethyl ethanoate) - 密度 0.90 g/cm³</option>
            <option value="dcm">二氯甲烷 (DCM) - 密度 1.33 g/cm³</option>
        `;
        document.getElementById('aqueous-select').innerHTML = `
            <option value="water">蒸餾水 (H₂O)</option>
            <option value="nahco3">碳酸氫鈉溶液 (NaHCO₃)</option>
            <option value="naoh">稀氫氧化鈉溶液 (NaOH)</option>
            <option value="hcl">稀鹽酸 (HCl)</option>
        `;
        
        resizeCanvas();
        determineLayers();
        initParticles();
        updateUI();
        animate();

        // Initial setup for buttons
        btnSettle.disabled = true;
        btnSettle.classList.add('opacity-50', 'cursor-not-allowed');
    </script>
</body>
